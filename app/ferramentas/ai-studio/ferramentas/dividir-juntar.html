<!doctype html><html lang="pt-BR"><head><style>/* 24/11: sem esticar */html,body,*{overscroll-behavior:none}</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa: Divisor-22.html + Juntador-2.html</title><style>body{margin:0;background:#0f172a;color:#e6edf8;font:14px system-ui}header{padding:8px 10px;background:#16213a;position:sticky;top:0;z-index:2}textarea{width:100%;box-sizing:border-box;min-height:54px;background:#0b0f18;color:inherit;border:1px solid #2b3a5c;border-radius:8px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px;padding:8px}section{border:1px solid #2b3a5c;border-radius:10px;overflow:hidden;background:#16213a}section b{display:block;padding:6px 8px}iframe{width:100%;height:65vh;border:0;background:#fff}button{background:#1e2b48;color:#fff;border:1px solid #2b3a5c;border-radius:8px;padding:6px 10px;margin:0 4px 6px 8px;font:inherit}</style></head><body><header>🖐️ <b>Mão</b> (o texto que você pegou):<textarea id="mao"></textarea></header><div class="g"><section><b>Divisor-22.html</b><button data-p="0">📤 Pegar texto</button><button data-c="0">📥 Colar aqui</button><iframe id="f0" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></section><section><b>Juntador-2.html</b><button data-p="1">📤 Pegar texto</button><button data-c="1">📥 Colar aqui</button><iframe id="f1" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></section></div><script>var P=[{"nome":"Divisor-22.html","src":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\u003cscript>(function(){var ME=\"Divisor-22.html\";var D={};var S={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){D[k]=String(v);parent.postMessage({brqLS:D,de:ME},\"*\")},removeItem:function(k){delete D[k];parent.postMessage({brqLS:D,de:ME},\"*\")},clear:function(){D={};parent.postMessage({brqLS:D,de:ME},\"*\")},key:function(i){return Object.keys(D)[i]||null},get length(){return Object.keys(D).length}};try{window.localStorage.getItem(\"x\")}catch(e){try{Object.defineProperty(window,\"localStorage\",{value:S,configurable:true})}catch(e2){}}window.Brinquedo={nome:ME,enviar:function(para,dados){parent.postMessage({brq:1,de:ME,para:para||\"*\",dados:dados},\"*\")},receber:function(fn){window.addEventListener(\"message\",function(e){var d=e.data;if(d&&d.brq&&d.de!==ME)fn(d.dados,d.de)})}};window.addEventListener(\"message\",function(e){var d=e.data;if(!d||!d.brqCmd)return;if(d.brqCmd===\"pegar\"){var s=String(window.getSelection()||\"\");if(!s.trim()){var c=document.querySelectorAll(\"textarea,output,pre,#resultado,.resultado,#saida,.saida,#output,.output\");for(var i=c.length-1;i>=0&&!s.trim();i--){s=c[i].value!=null&&c[i].tagName!==\"OUTPUT\"?c[i].value:c[i].innerText}}if(!s.trim())s=document.body.innerText;parent.postMessage({brqTexto:s,de:ME},\"*\")}if(d.brqCmd===\"colar\"){var a=document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)?document.activeElement:document.querySelector(\"textarea,input[type=text],input[type=search],input:not([type]),[contenteditable=true]\");if(a){if(\"value\" in a){a.value=d.texto;a.dispatchEvent(new Event(\"input\",{bubbles:true}));a.dispatchEvent(new Event(\"change\",{bubbles:true}))}else a.innerText=d.texto;a.focus&&a.focus()}parent.postMessage({brqColou:!!a,de:ME},\"*\")}});})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Divisor de Projetos HTML\u003c/title>\n\u003cstyle>\n* { box-sizing: border-box; margin: 0; padding: 0; }\nbody {\n  font-family: Arial, sans-serif;\n  background: #1a1a2e;\n  color: #eee;\n  min-height: 100vh;\n  padding: 20px;\n}\nh1 { text-align: center; color: #00d4ff; margin-bottom: 6px; font-size: 1.4em; }\n.sub { text-align: center; color: #aaa; font-size: 0.85em; margin-bottom: 20px; }\n.card {\n  background: #16213e;\n  border-radius: 12px;\n  padding: 18px;\n  margin-bottom: 16px;\n  border: 1px solid #0f3460;\n}\n.card h2 { color: #00d4ff; font-size: 1em; margin-bottom: 12px; }\n\n#dropZone {\n  border: 2px dashed #00d4ff;\n  border-radius: 10px;\n  padding: 30px;\n  text-align: center;\n  cursor: pointer;\n  background: #0d1b2a;\n  transition: background 0.3s;\n}\n#dropZone:hover, #dropZone.dragover { background: #1a3a5c; }\n#dropZone .icon { font-size: 2.5em; }\n#dropZone p { color: #aaa; font-size: 0.9em; margin-top: 8px; }\n#fileInput { display: none; }\n\nbutton {\n  padding: 10px 18px;\n  border: none;\n  border-radius: 8px;\n  cursor: pointer;\n  font-size: 0.9em;\n  font-weight: bold;\n  transition: opacity 0.2s;\n}\nbutton:hover { opacity: 0.85; }\nbutton:disabled { opacity: 0.4; cursor: not-allowed; }\n.btn-blue  { background: #00d4ff; color: #000; }\n.btn-green { background: #00c853; color: #000; }\n.btn-red   { background: #f44336; color: #fff; }\n.btn-orange{ background: #ff9800; color: #000; }\n.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }\n\n.opcoes {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 14px;\n  margin-top: 10px;\n}\n.opcao {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 0.85em;\n  color: #aaa;\n  cursor: pointer;\n}\n.opcao input { accent-color: #00d4ff; width: 16px; height: 16px; cursor: pointer; }\n\n.dica {\n  background: #0f3460;\n  border-left: 3px solid #ff9800;\n  padding: 10px 14px;\n  border-radius: 0 8px 8px 0;\n  font-size: 0.82em;\n  color: #aaa;\n  margin-top: 10px;\n}\n.dica strong { color: #ff9800; }\n\n/* PARTES GERADAS */\n.partes-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n  gap: 12px;\n  margin-top: 14px;\n}\n.parte-card {\n  background: #0d1b2a;\n  border: 1px solid #0f3460;\n  border-radius: 10px;\n  padding: 12px;\n  cursor: pointer;\n  transition: border-color 0.2s, background 0.2s;\n}\n.parte-card:hover { border-color: #00d4ff; background: #112244; }\n.parte-card.ativa { border-color: #00c853; background: #0a2a1a; }\n.parte-titulo {\n  color: #00d4ff;\n  font-size: 0.9em;\n  font-weight: bold;\n  margin-bottom: 6px;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n.parte-info {\n  font-size: 0.75em;\n  color: #888;\n  margin-bottom: 8px;\n}\n.parte-badges {\n  display: flex;\n  gap: 6px;\n  flex-wrap: wrap;\n  margin-bottom: 8px;\n}\n.badge {\n  background: #0f3460;\n  border-radius: 10px;\n  padding: 2px 8px;\n  font-size: 0.72em;\n  color: #00d4ff;\n}\n.badge.css { background: #1a2a0a; color: #69f0ae; }\n.badge.js  { background: #2a1a0a; color: #ffb74d; }\n.badge.html{ background: #0a1a2a; color: #64b5f6; }\n.parte-btns {\n  display: flex;\n  gap: 6px;\n  flex-wrap: wrap;\n}\n.parte-btns button {\n  padding: 5px 10px;\n  font-size: 0.75em;\n}\n\n/* PREVIEW */\n#previewArea { display: none; }\n.preview-tabs {\n  display: flex;\n  gap: 6px;\n  flex-wrap: wrap;\n  margin-bottom: 10px;\n}\n.tab {\n  padding: 6px 14px;\n  border-radius: 8px;\n  background: #0f3460;\n  color: #aaa;\n  cursor: pointer;\n  font-size: 0.82em;\n  border: 1px solid transparent;\n  transition: all 0.2s;\n}\n.tab:hover { background: #1a3a5c; }\n.tab.ativa { background: #00d4ff; color: #000; border-color: #00d4ff; }\n\n#previewCodigo {\n  width: 100%;\n  min-height: 250px;\n  background: #0d1b2a;\n  color: #eee;\n  border: 1px solid #0f3460;\n  border-radius: 8px;\n  padding: 12px;\n  font-size: 0.8em;\n  font-family: monospace;\n  resize: vertical;\n}\n#previewFrame {\n  width: 100%;\n  height: 400px;\n  border: 1px solid #0f3460;\n  border-radius: 8px;\n  background: white;\n  display: none;\n}\n\n.stats {\n  display: flex;\n  gap: 10px;\n  flex-wrap: wrap;\n  margin-bottom: 12px;\n}\n\n#log {\n  background: #0d1b2a;\n  border-radius: 8px;\n  padding: 10px;\n  font-size: 0.78em;\n  font-family: monospace;\n  color: #69f0ae;\n  min-height: 60px;\n  max-height: 150px;\n  overflow-y: auto;\n  margin-top: 10px;\n  display: none;\n}\n\n.arquivo-selecionado {\n  background: #0d1b2a;\n  border: 1px solid #00d4ff;\n  border-radius: 8px;\n  padding: 10px 14px;\n  margin-top: 12px;\n  font-size: 0.85em;\n  display: none;\n}\n.arquivo-selecionado span { color: #00d4ff; font-weight: bold; }\n\nselect {\n  background: #0d1b2a;\n  color: #eee;\n  border: 1px solid #0f3460;\n  border-radius: 8px;\n  padding: 8px 12px;\n  font-size: 0.85em;\n  width: 100%;\n  margin-top: 8px;\n  cursor: pointer;\n}\nselect:focus { outline: none; border-color: #00d4ff; }\n\n.separador { border: none; border-top: 1px solid #0f3460; margin: 14px 0; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>✂️ Divisor de Projetos HTML\u003c/h1>\n\u003cp class=\"sub\">Importa ZIP ou HTML único e divide em partes modulares — com preview em tempo real\u003c/p>\n\n\u003c!-- UPLOAD -->\n\u003cdiv class=\"card\">\n  \u003ch2>📁 1. Importe o projeto\u003c/h2>\n  \u003cdiv id=\"dropZone\" onclick=\"document.getElementById('fileInput').click()\">\n    \u003cdiv class=\"icon\">📦\u003c/div>\n    \u003cp>Clique aqui ou arraste o arquivo\u003c/p>\n    \u003cp style=\"font-size:0.75em; margin-top:4px;\">Aceita: .zip, .html, .htm\u003c/p>\n  \u003c/div>\n  \u003cinput type=\"file\" id=\"fileInput\" accept=\".zip,.html,.htm\">\n  \u003cdiv class=\"arquivo-selecionado\" id=\"arquivoSelecionado\">\n    📄 Arquivo: \u003cspan id=\"nomeArquivo\">—\u003c/span> &nbsp;|&nbsp;\n    Tamanho: \u003cspan id=\"tamanhoArquivo\">—\u003c/span>\n  \u003c/div>\n\n  \u003c!-- Seletor de principal (aparece só para ZIP) -->\n  \u003cdiv id=\"seletorPrincipal\" style=\"display:none;\">\n    \u003chr class=\"separador\">\n    \u003clabel style=\"font-size:0.85em; color:#aaa;\">\n      📌 Selecione o arquivo HTML principal do ZIP:\n    \u003c/label>\n    \u003cselect id=\"selectPrincipal\">\u003c/select>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- OPÇÕES -->\n\u003cdiv class=\"card\">\n  \u003ch2>⚙️ 2. Opções de divisão\u003c/h2>\n  \u003cdiv class=\"opcoes\">\n    \u003clabel class=\"opcao\">\n      \u003cinput type=\"checkbox\" id=\"optCSS\" checked>\n      Extrair CSS para arquivo separado\n    \u003c/label>\n    \u003clabel class=\"opcao\">\n      \u003cinput type=\"checkbox\" id=\"optJS\" checked>\n      Extrair JS para arquivo separado\n    \u003c/label>\n    \u003clabel class=\"opcao\">\n      \u003cinput type=\"checkbox\" id=\"optSecoes\" checked>\n      Dividir JS em seções lógicas\n    \u003c/label>\n    \u003clabel class=\"opcao\">\n      \u003cinput type=\"checkbox\" id=\"optComentarios\" checked>\n      Manter comentários de separação\n    \u003c/label>\n    \u003clabel class=\"opcao\">\n      \u003cinput type=\"checkbox\" id=\"optLog\">\n      Mostrar log detalhado\n    \u003c/label>\n  \u003c/div>\n  \u003cdiv class=\"dica\">\n    \u003cstrong>💡 Como funciona:\u003c/strong> O divisor extrai CSS e JS do HTML, identifica seções lógicas (configurações, funções, eventos, etc.) e gera arquivos separados prontos para editar. Clique em qualquer parte para ver o código e o preview.\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- PROCESSAR -->\n\u003cdiv class=\"card\">\n  \u003ch2>🚀 3. Dividir projeto\u003c/h2>\n  \u003cdiv class=\"btns\">\n    \u003cbutton class=\"btn-blue\" id=\"btnDividir\" onclick=\"dividir()\" disabled>\n      ✂️ Dividir Projeto\n    \u003c/button>\n    \u003cbutton class=\"btn-red\" onclick=\"limparTudo()\">🗑️ Limpar\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"log\">\u003c/div>\n\u003c/div>\n\n\u003c!-- PARTES GERADAS -->\n\u003cdiv class=\"card\" id=\"partesArea\" style=\"display:none;\">\n  \u003ch2>📦 4. Partes geradas\u003c/h2>\n  \u003cdiv class=\"stats\" id=\"statsGerais\">\u003c/div>\n  \u003cdiv class=\"partes-grid\" id=\"partesGrid\">\u003c/div>\n  \u003chr class=\"separador\">\n  \u003cdiv class=\"btns\">\n    \u003cbutton class=\"btn-green\" onclick=\"baixarTudo()\">⬇️ Baixar Todas as Partes (ZIP)\u003c/button>\n    \u003cbutton class=\"btn-blue\" onclick=\"baixarIndice()\">📋 Baixar index.html Modular\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- PREVIEW -->\n\u003cdiv class=\"card\" id=\"previewArea\">\n  \u003ch2 id=\"previewTitulo\">👁️ Preview\u003c/h2>\n  \u003cdiv class=\"preview-tabs\">\n    \u003cdiv class=\"tab ativa\" onclick=\"mudarTab('codigo')\">📝 Código\u003c/div>\n    \u003cdiv class=\"tab\" onclick=\"mudarTab('visual')\">🖥️ Visual\u003c/div>\n  \u003c/div>\n  \u003ctextarea id=\"previewCodigo\" readonly>\u003c/textarea>\n  \u003ciframe id=\"previewFrame\" sandbox=\"allow-scripts allow-same-origin\">\u003c/iframe>\n  \u003cdiv class=\"btns\" style=\"margin-top:10px;\">\n    \u003cbutton class=\"btn-green\" id=\"btnBaixarParte\" onclick=\"baixarParte()\">⬇️ Baixar esta parte\u003c/button>\n    \u003cbutton class=\"btn-blue\" onclick=\"copiarParte()\">📋 Copiar código\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\">\u003c/script>\n\u003cscript>\n// ===================== ESTADO =====================\nlet arquivoAtual = null;\nlet conteudoHTML = '';\nlet partesGeradas = [];\nlet parteAtiva = null;\nlet tabAtiva = 'codigo';\nlet arquivosZip = {};\n\n// ===================== UPLOAD =====================\nconst dropZone = document.getElementById('dropZone');\ndropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });\ndropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));\ndropZone.addEventListener('drop', e => {\n  e.preventDefault();\n  dropZone.classList.remove('dragover');\n  if (e.dataTransfer.files[0]) processarArquivo(e.dataTransfer.files[0]);\n});\ndocument.getElementById('fileInput').addEventListener('change', e => {\n  if (e.target.files[0]) processarArquivo(e.target.files[0]);\n  e.target.value = '';\n});\n\nasync function processarArquivo(file) {\n  arquivoAtual = file;\n  document.getElementById('arquivoSelecionado').style.display = 'block';\n  document.getElementById('nomeArquivo').textContent = file.name;\n  document.getElementById('tamanhoArquivo').textContent = formatBytes(file.size);\n\n  if (file.name.endsWith('.zip')) {\n    await processarZip(file);\n  } else {\n    conteudoHTML = await lerTexto(file);\n    document.getElementById('seletorPrincipal').style.display = 'none';\n    document.getElementById('btnDividir').disabled = false;\n    addLog('✅ HTML carregado: ' + file.name);\n  }\n}\n\nasync function processarZip(file) {\n  addLog('📦 Lendo ZIP...');\n  try {\n    const zip = await JSZip.loadAsync(file);\n    arquivosZip = {};\n    const htmls = [];\n\n    for (const [nome, entrada] of Object.entries(zip.files)) {\n      if (!entrada.dir) {\n        const ext = nome.split('.').pop().toLowerCase();\n        if (['html','htm','css','js','json'].includes(ext)) {\n          arquivosZip[nome] = await entrada.async('text');\n          if (ext === 'html' || ext === 'htm') htmls.push(nome);\n          addLog('📄 Lido: ' + nome);\n        }\n      }\n    }\n\n    if (htmls.length === 0) {\n      alert('Nenhum arquivo HTML encontrado no ZIP!');\n      return;\n    }\n\n    // Preencher seletor\n    const sel = document.getElementById('selectPrincipal');\n    sel.innerHTML = '';\n    // Priorizar index.html\n    const ordenados = htmls.sort((a,b) => {\n      if (a.includes('index')) return -1;\n      if (b.includes('index')) return 1;\n      return a.localeCompare(b);\n    });\n    ordenados.forEach(h => {\n      const opt = document.createElement('option');\n      opt.value = h;\n      opt.textContent = h;\n      sel.appendChild(opt);\n    });\n\n    document.getElementById('seletorPrincipal').style.display = 'block';\n    sel.onchange = () => {\n      conteudoHTML = arquivosZip[sel.value] || '';\n      document.getElementById('btnDividir').disabled = !conteudoHTML;\n    };\n    // Selecionar o primeiro automaticamente\n    conteudoHTML = arquivosZip[ordenados[0]] || '';\n    document.getElementById('btnDividir').disabled = false;\n    addLog('✅ ZIP processado. ' + htmls.length + ' HTML(s) encontrado(s).');\n  } catch(e) {\n    alert('Erro ao ler ZIP: ' + e.message);\n  }\n}\n\n// ===================== DIVISÃO =====================\nfunction dividir() {\n  if (!conteudoHTML) return;\n  document.getElementById('log').innerHTML = '';\n  partesGeradas = [];\n  parteAtiva = null;\n\n  addLog('✂️ Iniciando divisão...');\n\n  const optCSS = document.getElementById('optCSS').checked;\n  const optJS  = document.getElementById('optJS').checked;\n  const optSec = document.getElementById('optSecoes').checked;\n  const optCom = document.getElementById('optComentarios').checked;\n\n  let htmlRestante = conteudoHTML;\n\n  // ---- EXTRAIR CSS ----\n  if (optCSS) {\n    const cssBlocks = [];\n    const regexStyle = /\u003cstyle[^>]*>([\\s\\S]*?)\u003c\\/style>/gi;\n    let match;\n    while ((match = regexStyle.exec(conteudoHTML)) !== null) {\n      cssBlocks.push(match[1].trim());\n    }\n    if (cssBlocks.length > 0) {\n      const cssConteudo = cssBlocks.join('\\n\\n/* ===== BLOCO SEGUINTE ===== */\\n\\n');\n      partesGeradas.push({\n        id: 'estilos',\n        nome: 'estilos.css',\n        tipo: 'css',\n        icone: '🎨',\n        descricao: 'Todos os estilos CSS extraídos',\n        conteudo: cssConteudo,\n        linhas: cssConteudo.split('\\n').length,\n        tamanho: new Blob([cssConteudo]).size\n      });\n      // Remover styles do HTML e adicionar link\n      htmlRestante = htmlRestante.replace(/\u003cstyle[^>]*>[\\s\\S]*?\u003c\\/style>/gi, '');\n      htmlRestante = htmlRestante.replace('\u003c/head>',\n        (optCom ? '  \u003c!-- CSS extraído -->\\n' : '') +\n        '  \u003clink rel=\"stylesheet\" href=\"estilos.css\">\\n\u003c/head>'\n      );\n      addLog('🎨 CSS extraído: ' + cssBlocks.length + ' bloco(s)');\n    }\n  }\n\n  // ---- EXTRAIR JS ----\n  if (optJS) {\n    const jsBlocks = [];\n    const regexScript = /\u003cscript(?![^>]*src)[^>]*>([\\s\\S]*?)\u003c\\/script>/gi;\n    let match;\n    while ((match = regexScript.exec(conteudoHTML)) !== null) {\n      const conteudo = match[1].trim();\n      if (conteudo.length > 10) jsBlocks.push(conteudo);\n    }\n\n    if (jsBlocks.length > 0) {\n      const jsTotal = jsBlocks.join('\\n\\n/* ===== BLOCO SEGUINTE ===== */\\n\\n');\n\n      if (optSec) {\n        // Dividir em seções lógicas\n        const secoes = dividirEmSecoes(jsTotal);\n        secoes.forEach((sec, i) => {\n          partesGeradas.push({\n            id: 'js_' + i,\n            nome: sec.nome,\n            tipo: 'js',\n            icone: '⚡',\n            descricao: sec.descricao,\n            conteudo: sec.conteudo,\n            linhas: sec.conteudo.split('\\n').length,\n            tamanho: new Blob([sec.conteudo]).size\n          });\n          addLog('⚡ Seção JS: ' + sec.nome + ' (' + sec.conteudo.split('\\n').length + ' linhas)');\n        });\n\n        // Substituir scripts por imports\n        htmlRestante = htmlRestante.replace(/\u003cscript(?![^>]*src)[^>]*>[\\s\\S]*?\u003c\\/script>/gi, '');\n        let imports = secoes.map(s =>\n          (optCom ? `  \u003c!-- JS: ${s.nome} -->\\n` : '') +\n          `  \u003cscript src=\"${s.nome}\">\u003c\\/script>`\n        ).join('\\n');\n        htmlRestante = htmlRestante.replace('\u003c/body>', imports + '\\n\u003c/body>');\n\n      } else {\n        // JS em arquivo único\n        partesGeradas.push({\n          id: 'scripts',\n          nome: 'scripts.js',\n          tipo: 'js',\n          icone: '⚡',\n          descricao: 'Todo o JavaScript extraído',\n          conteudo: jsTotal,\n          linhas: jsTotal.split('\\n').length,\n          tamanho: new Blob([jsTotal]).size\n        });\n        htmlRestante = htmlRestante.replace(/\u003cscript(?![^>]*src)[^>]*>[\\s\\S]*?\u003c\\/script>/gi, '');\n        htmlRestante = htmlRestante.replace('\u003c/body>',\n          (optCom ? '  \u003c!-- JS extraído -->\\n' : '') +\n          '  \u003cscript src=\"scripts.js\">\u003c\\/script>\\n\u003c/body>'\n        );\n        addLog('⚡ JS extraído em arquivo único');\n      }\n    }\n  }\n\n  // ---- HTML LIMPO ----\n  // Limpar linhas vazias excessivas\n  htmlRestante = htmlRestante.replace(/\\n{3,}/g, '\\n\\n').trim();\n  partesGeradas.unshift({\n    id: 'index',\n    nome: 'index.html',\n    tipo: 'html',\n    icone: '🌐',\n    descricao: 'HTML principal (estrutura limpa)',\n    conteudo: htmlRestante,\n    linhas: htmlRestante.split('\\n').length,\n    tamanho: new Blob([htmlRestante]).size\n  });\n  addLog('🌐 index.html gerado (' + htmlRestante.split('\\n').length + ' linhas)');\n\n  // ---- ARQUIVOS DO ZIP (se houver) ----\n  Object.entries(arquivosZip).forEach(([nome, conteudo]) => {\n    const ext = nome.split('.').pop().toLowerCase();\n    if (ext === 'css' && document.getElementById('optCSS').checked) return;\n    if (ext === 'js' && document.getElementById('optJS').checked) return;\n    if (ext === 'html' || ext === 'htm') return;\n    partesGeradas.push({\n      id: 'zip_' + nome.replace(/[^a-z0-9]/gi,'_'),\n      nome: nome.split('/').pop(),\n      tipo: ext,\n      icone: ext === 'json' ? '📋' : '📄',\n      descricao: 'Arquivo do ZIP original',\n      conteudo: conteudo,\n      linhas: conteudo.split('\\n').length,\n      tamanho: new Blob([conteudo]).size\n    });\n  });\n\n  renderPartes();\n  addLog('✅ Divisão concluída! ' + partesGeradas.length + ' partes geradas.');\n}\n\n// ===================== DIVIDIR EM SEÇÕES =====================\nfunction dividirEmSecoes(jsTotal) {\n  const secoes = [];\n\n  // Padrões para identificar seções\n  const padroes = [\n    { regex: /\\/\\*[\\s\\S]*?(?:config|configurac|settings|variav|const[^a-z]|let[^a-z])[\\s\\S]*?\\*\\/|(?:\\/\\/.*(?:config|variav|constante).*\\n)?((?:const|let|var)\\s+\\w+\\s*=[\\s\\S]*?(?=\\n(?:const|let|var|function|class|\\/\\/|\\/\\*|$)))/gi, nome: '01-config.js', desc: 'Configurações e variáveis' },\n  ];\n\n  // Abordagem mais robusta: dividir por blocos de funções/classes/eventos\n  const linhas = jsTotal.split('\\n');\n  const blocos = [];\n  let blocoAtual = [];\n  let profundidade = 0;\n  let tipoBloco = 'config';\n\n  // Identificar seções por comentários ou palavras-chave\n  const marcadores = [\n    { regex: /\\/\\/.*(?:config|variav|constante|setting)/i, tipo: 'config' },\n    { regex: /\\/\\/.*(?:util|helper|auxiliar|format)/i, tipo: 'utils' },\n    { regex: /\\/\\/.*(?:api|fetch|request|http|ajax)/i, tipo: 'api' },\n    { regex: /\\/\\/.*(?:event|listener|click|submit|change)/i, tipo: 'eventos' },\n    { regex: /\\/\\/.*(?:render|display|show|ui|interface)/i, tipo: 'ui' },\n    { regex: /\\/\\/.*(?:init|start|load|ready|main)/i, tipo: 'init' },\n  ];\n\n  // Separar por funções principais\n  const secaoConfig = [];\n  const secaoFuncoes = [];\n  const secaoEventos = [];\n  const secaoInit = [];\n\n  let emFuncao = false;\n  let funcaoAtual = [];\n  let nomeFuncaoAtual = '';\n  let dentroDeEventListener = false;\n\n  for (let i = 0; i \u003c linhas.length; i++) {\n    const linha = linhas[i];\n\n    // Detectar início de função\n    const matchFunc = linha.match(/^(?:async\\s+)?function\\s+(\\w+)|^(?:const|let|var)\\s+(\\w+)\\s*=\\s*(?:async\\s+)?(?:function|\\()/);\n    const matchEvent = linha.match(/addEventListener|\\.on\\w+\\s*=/);\n    const matchConst = linha.match(/^(?:const|let|var)\\s+\\w+\\s*=\\s*[^{(]/);\n\n    // Contar chaves para saber profundidade\n    for (const c of linha) {\n      if (c === '{') profundidade++;\n      if (c === '}') profundidade--;\n    }\n\n    if (matchEvent) {\n      secaoEventos.push(linha);\n    } else if (matchConst && profundidade === 0) {\n      secaoConfig.push(linha);\n    } else if (matchFunc) {\n      secaoFuncoes.push(linha);\n    } else if (profundidade === 0 && linha.trim().startsWith('//')) {\n      // Comentário de seção — vai para config\n      secaoConfig.push(linha);\n    } else {\n      // Resto vai para init/geral\n      secaoInit.push(linha);\n    }\n  }\n\n  // Criar seções apenas se tiverem conteúdo\n  const todasSecoes = [\n    { conteudo: secaoConfig.join('\\n').trim(),   nome: '01-variaveis.js',  descricao: 'Variáveis e configurações' },\n    { conteudo: secaoFuncoes.join('\\n').trim(),  nome: '02-funcoes.js',    descricao: 'Funções principais' },\n    { conteudo: secaoEventos.join('\\n').trim(),  nome: '03-eventos.js',    descricao: 'Eventos e listeners' },\n    { conteudo: secaoInit.join('\\n').trim(),     nome: '04-inicializacao.js', descricao: 'Inicialização e lógica geral' },\n  ];\n\n  todasSecoes.forEach(s => {\n    if (s.conteudo.length > 10) secoes.push(s);\n  });\n\n  // Se a divisão ficou muito fragmentada, usar arquivo único\n  if (secoes.length === 0) {\n    secoes.push({ conteudo: jsTotal, nome: 'scripts.js', descricao: 'JavaScript completo' });\n  }\n\n  return secoes;\n}\n\n// ===================== RENDER PARTES =====================\nfunction renderPartes() {\n  const grid = document.getElementById('partesGrid');\n  const stats = document.getElementById('statsGerais');\n\n  const totalLinhas = partesGeradas.reduce((s, p) => s + p.linhas, 0);\n  const totalTamanho = partesGeradas.reduce((s, p) => s + p.tamanho, 0);\n\n  stats.innerHTML = `\n    \u003cspan class=\"badge\">${partesGeradas.length} partes\u003c/span>\n    \u003cspan class=\"badge\">${totalLinhas.toLocaleString()} linhas total\u003c/span>\n    \u003cspan class=\"badge\">${formatBytes(totalTamanho)}\u003c/span>\n  `;\n\n  grid.innerHTML = partesGeradas.map(p => `\n    \u003cdiv class=\"parte-card ${parteAtiva === p.id ? 'ativa' : ''}\" id=\"card-${p.id}\" onclick=\"selecionarParte('${p.id}')\">\n      \u003cdiv class=\"parte-titulo\">${p.icone} ${p.nome}\u003c/div>\n      \u003cdiv class=\"parte-info\">${p.descricao}\u003c/div>\n      \u003cdiv class=\"parte-badges\">\n        \u003cspan class=\"badge ${p.tipo}\">${p.tipo.toUpperCase()}\u003c/span>\n        \u003cspan class=\"badge\">${p.linhas} linhas\u003c/span>\n        \u003cspan class=\"badge\">${formatBytes(p.tamanho)}\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"parte-btns\">\n        \u003cbutton class=\"btn-blue\" onclick=\"event.stopPropagation(); selecionarParte('${p.id}'); mudarTab('codigo')\">📝 Ver código\u003c/button>\n        \u003cbutton class=\"btn-green\" onclick=\"event.stopPropagation(); selecionarParte('${p.id}'); mudarTab('visual')\">🖥️ Preview\u003c/button>\n        \u003cbutton class=\"btn-orange\" onclick=\"event.stopPropagation(); baixarParteId('${p.id}')\">⬇️ Baixar\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  `).join('');\n\n  document.getElementById('partesArea').style.display = 'block';\n\n  // Selecionar index.html automaticamente\n  selecionarParte('index');\n}\n\n// ===================== PREVIEW =====================\nfunction selecionarParte(id) {\n  parteAtiva = id;\n  const parte = partesGeradas.find(p => p.id === id);\n  if (!parte) return;\n\n  // Atualizar cards\n  document.querySelectorAll('.parte-card').forEach(c => c.classList.remove('ativa'));\n  const card = document.getElementById('card-' + id);\n  if (card) card.classList.add('ativa');\n\n  // Mostrar preview\n  document.getElementById('previewTitulo').textContent = '👁️ Preview — ' + parte.nome;\n  document.getElementById('previewCodigo').value = parte.conteudo;\n  document.getElementById('previewArea').style.display = 'block';\n\n  // Scroll para preview\n  document.getElementById('previewArea').scrollIntoView({ behavior: 'smooth', block: 'start' });\n\n  // Atualizar visual se tab visual estiver ativa\n  if (tabAtiva === 'visual') atualizarVisual(parte);\n}\n\nfunction mudarTab(tab) {\n  tabAtiva = tab;\n  document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativa'));\n  event.target.classList.add('ativa');\n\n  const codArea = document.getElementById('previewCodigo');\n  const frame   = document.getElementById('previewFrame');\n\n  if (tab === 'codigo') {\n    codArea.style.display = 'block';\n    frame.style.display = 'none';\n  } else {\n    codArea.style.display = 'none';\n    frame.style.display = 'block';\n    const parte = partesGeradas.find(p => p.id === parteAtiva);\n    if (parte) atualizarVisual(parte);\n  }\n}\n\nfunction atualizarVisual(parte) {\n  const frame = document.getElementById('previewFrame');\n  let html = '';\n\n  if (parte.tipo === 'html') {\n    html = parte.conteudo;\n  } else if (parte.tipo === 'css') {\n    html = `\u003c!DOCTYPE html>\u003chtml>\u003chead>\u003cstyle>${parte.conteudo}\u003c/style>\u003c/head>\n    \u003cbody style=\"background:#1a1a2e;color:#eee;padding:20px;font-family:Arial\">\n    \u003ch2 style=\"color:#00d4ff\">Preview CSS\u003c/h2>\n    \u003cp>Este arquivo contém apenas estilos.\u003c/p>\n    \u003cdiv class=\"exemplo\" style=\"margin-top:16px\">\n      \u003cbutton>Botão exemplo\u003c/button>\n      \u003cp>Parágrafo exemplo\u003c/p>\n    \u003c/div>\u003c/body>\u003c/html>`;\n  } else if (parte.tipo === 'js') {\n    html = `\u003c!DOCTYPE html>\u003chtml>\u003chead>\u003c/head>\n    \u003cbody style=\"background:#1a1a2e;color:#eee;padding:20px;font-family:Arial,monospace\">\n    \u003ch2 style=\"color:#00d4ff\">Preview JS — ${parte.nome}\u003c/h2>\n    \u003cpre style=\"background:#0d1b2a;padding:14px;border-radius:8px;overflow:auto;font-size:0.78em;color:#69f0ae;max-height:300px\">${escapeHtml(parte.conteudo.substring(0, 3000))}${parte.conteudo.length > 3000 ? '\\n\\n... (truncado para preview)' : ''}\u003c/pre>\n    \u003c/body>\u003c/html>`;\n  } else {\n    html = `\u003c!DOCTYPE html>\u003chtml>\u003cbody style=\"background:#1a1a2e;color:#eee;padding:20px;font-family:monospace\">\n    \u003cpre>${escapeHtml(parte.conteudo.substring(0, 2000))}\u003c/pre>\u003c/body>\u003c/html>`;\n  }\n\n  frame.srcdoc = html;\n}\n\n// ===================== DOWNLOADS =====================\nfunction baixarParte() {\n  if (!parteAtiva) return;\n  baixarParteId(parteAtiva);\n}\n\nfunction baixarParteId(id) {\n  const parte = partesGeradas.find(p => p.id === id);\n  if (!parte) return;\n  const tipo = parte.tipo === 'html' ? 'text/html' :\n               parte.tipo === 'css'  ? 'text/css'  :\n               parte.tipo === 'js'   ? 'text/javascript' : 'text/plain';\n  const blob = new Blob([parte.conteudo], { type: tipo });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = parte.nome;\n  a.click();\n}\n\nasync function baixarTudo() {\n  if (typeof JSZip === 'undefined') {\n    alert('JSZip não carregou. Tente baixar cada parte individualmente.');\n    return;\n  }\n  const zip = new JSZip();\n  partesGeradas.forEach(p => zip.file(p.nome, p.conteudo));\n  const blob = await zip.generateAsync({ type: 'blob' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'projeto_modular.zip';\n  a.click();\n}\n\nfunction baixarIndice() {\n  const index = partesGeradas.find(p => p.id === 'index');\n  if (!index) return;\n  const blob = new Blob([index.conteudo], { type: 'text/html' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'index.html';\n  a.click();\n}\n\nfunction copiarParte() {\n  const texto = document.getElementById('previewCodigo').value;\n  navigator.clipboard.writeText(texto)\n    .then(() => alert('✅ Código copiado!'))\n    .catch(() => {\n      document.getElementById('previewCodigo').select();\n      document.execCommand('copy');\n      alert('✅ Código copiado!');\n    });\n}\n\n// ===================== UTILS =====================\nfunction lerTexto(file) {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = e => resolve(e.target.result);\n    reader.onerror = reject;\n    reader.readAsText(file, 'UTF-8');\n  });\n}\n\nfunction addLog(msg) {\n  const log = document.getElementById('log');\n  if (document.getElementById('optLog').checked) {\n    log.style.display = 'block';\n    log.innerHTML += msg + '\\n';\n    log.scrollTop = log.scrollHeight;\n  }\n}\n\nfunction limparTudo() {\n  arquivoAtual = null;\n  conteudoHTML = '';\n  partesGeradas = [];\n  parteAtiva = null;\n  arquivosZip = {};\n  document.getElementById('arquivoSelecionado').style.display = 'none';\n  document.getElementById('seletorPrincipal').style.display = 'none';\n  document.getElementById('partesArea').style.display = 'none';\n  document.getElementById('previewArea').style.display = 'none';\n  document.getElementById('log').innerHTML = '';\n  document.getElementById('log').style.display = 'none';\n  document.getElementById('btnDividir').disabled = true;\n  document.getElementById('fileInput').value = '';\n}\n\nfunction formatBytes(bytes) {\n  if (bytes \u003c 1024) return bytes + ' B';\n  if (bytes \u003c 1048576) return (bytes/1024).toFixed(1) + ' KB';\n  return (bytes/1048576).toFixed(1) + ' MB';\n}\n\nfunction escapeHtml(str) {\n  return str.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"nome":"Juntador-2.html","src":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\u003cscript>(function(){var ME=\"Juntador-2.html\";var D={};var S={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){D[k]=String(v);parent.postMessage({brqLS:D,de:ME},\"*\")},removeItem:function(k){delete D[k];parent.postMessage({brqLS:D,de:ME},\"*\")},clear:function(){D={};parent.postMessage({brqLS:D,de:ME},\"*\")},key:function(i){return Object.keys(D)[i]||null},get length(){return Object.keys(D).length}};try{window.localStorage.getItem(\"x\")}catch(e){try{Object.defineProperty(window,\"localStorage\",{value:S,configurable:true})}catch(e2){}}window.Brinquedo={nome:ME,enviar:function(para,dados){parent.postMessage({brq:1,de:ME,para:para||\"*\",dados:dados},\"*\")},receber:function(fn){window.addEventListener(\"message\",function(e){var d=e.data;if(d&&d.brq&&d.de!==ME)fn(d.dados,d.de)})}};window.addEventListener(\"message\",function(e){var d=e.data;if(!d||!d.brqCmd)return;if(d.brqCmd===\"pegar\"){var s=String(window.getSelection()||\"\");if(!s.trim()){var c=document.querySelectorAll(\"textarea,output,pre,#resultado,.resultado,#saida,.saida,#output,.output\");for(var i=c.length-1;i>=0&&!s.trim();i--){s=c[i].value!=null&&c[i].tagName!==\"OUTPUT\"?c[i].value:c[i].innerText}}if(!s.trim())s=document.body.innerText;parent.postMessage({brqTexto:s,de:ME},\"*\")}if(d.brqCmd===\"colar\"){var a=document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)?document.activeElement:document.querySelector(\"textarea,input[type=text],input[type=search],input:not([type]),[contenteditable=true]\");if(a){if(\"value\" in a){a.value=d.texto;a.dispatchEvent(new Event(\"input\",{bubbles:true}));a.dispatchEvent(new Event(\"change\",{bubbles:true}))}else a.innerText=d.texto;a.focus&&a.focus()}parent.postMessage({brqColou:!!a,de:ME},\"*\")}});})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Juntador de Projetos HTML\u003c/title>\n\u003cstyle>\n* { box-sizing: border-box; margin: 0; padding: 0; }\nbody {\n  font-family: Arial, sans-serif;\n  background: #1a1a2e;\n  color: #eee;\n  min-height: 100vh;\n  padding: 20px;\n}\nh1 { text-align: center; color: #00d4ff; margin-bottom: 6px; font-size: 1.4em; }\n.sub { text-align: center; color: #aaa; font-size: 0.85em; margin-bottom: 20px; }\n.card {\n  background: #16213e;\n  border-radius: 12px;\n  padding: 18px;\n  margin-bottom: 16px;\n  border: 1px solid #0f3460;\n}\n.card h2 { color: #00d4ff; font-size: 1em; margin-bottom: 12px; }\n\n#dropZone {\n  border: 2px dashed #00d4ff;\n  border-radius: 10px;\n  padding: 30px;\n  text-align: center;\n  cursor: pointer;\n  background: #0d1b2a;\n  transition: background 0.3s;\n}\n#dropZone:hover, #dropZone.dragover { background: #1a3a5c; }\n#dropZone .icon { font-size: 2.5em; }\n#dropZone p { color: #aaa; font-size: 0.9em; margin-top: 8px; }\n#fileInput { display: none; }\n\nbutton {\n  padding: 10px 18px;\n  border: none;\n  border-radius: 8px;\n  cursor: pointer;\n  font-size: 0.9em;\n  font-weight: bold;\n  transition: opacity 0.2s;\n}\nbutton:hover { opacity: 0.85; }\nbutton:disabled { opacity: 0.4; cursor: not-allowed; }\n.btn-blue   { background: #00d4ff; color: #000; }\n.btn-green  { background: #00c853; color: #000; }\n.btn-red    { background: #f44336; color: #fff; }\n.btn-orange { background: #ff9800; color: #000; }\n.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }\n\nselect {\n  background: #0d1b2a;\n  color: #eee;\n  border: 1px solid #0f3460;\n  border-radius: 8px;\n  padding: 8px 12px;\n  font-size: 0.85em;\n  width: 100%;\n  margin-top: 8px;\n  cursor: pointer;\n}\nselect:focus { outline: none; border-color: #00d4ff; }\n\n.separador { border: none; border-top: 1px solid #0f3460; margin: 14px 0; }\n\n.dica {\n  background: #0f3460;\n  border-left: 3px solid #ff9800;\n  padding: 10px 14px;\n  border-radius: 0 8px 8px 0;\n  font-size: 0.82em;\n  color: #aaa;\n  margin-top: 10px;\n}\n.dica strong { color: #ff9800; }\n\n/* GRID DE ARQUIVOS */\n.arquivos-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));\n  gap: 10px;\n  margin-top: 14px;\n}\n.arquivo-card {\n  background: #0d1b2a;\n  border: 1px solid #0f3460;\n  border-radius: 10px;\n  padding: 12px;\n  cursor: pointer;\n  transition: border-color 0.2s, background 0.2s;\n  user-select: none;\n}\n.arquivo-card:hover { border-color: #00d4ff; background: #112244; }\n.arquivo-card.selecionado { border-color: #00c853; background: #0a2a1a; }\n.arquivo-card.principal { border-color: #ff9800; background: #1a1200; }\n.arquivo-titulo {\n  font-size: 0.88em;\n  font-weight: bold;\n  margin-bottom: 5px;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  word-break: break-all;\n}\n.arquivo-titulo.css-cor { color: #69f0ae; }\n.arquivo-titulo.js-cor  { color: #ffb74d; }\n.arquivo-titulo.html-cor{ color: #64b5f6; }\n.arquivo-titulo.outro-cor{ color: #aaa; }\n.arquivo-info { font-size: 0.75em; color: #888; margin-bottom: 8px; }\n.arquivo-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }\n.badge {\n  background: #0f3460;\n  border-radius: 10px;\n  padding: 2px 8px;\n  font-size: 0.72em;\n  color: #00d4ff;\n}\n.badge.css  { background: #1a2a0a; color: #69f0ae; }\n.badge.js   { background: #2a1a0a; color: #ffb74d; }\n.badge.html { background: #0a1a2a; color: #64b5f6; }\n.badge.principal-badge { background: #2a1a00; color: #ff9800; }\n.arquivo-btns { display: flex; gap: 6px; flex-wrap: wrap; }\n.arquivo-btns button { padding: 5px 10px; font-size: 0.75em; }\n\n.check-label {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 0.82em;\n  color: #aaa;\n  margin-top: 8px;\n}\n.check-label input { accent-color: #00c853; width: 16px; height: 16px; cursor: pointer; }\n\n/* PREVIEW */\n.preview-tabs {\n  display: flex;\n  gap: 6px;\n  flex-wrap: wrap;\n  margin-bottom: 10px;\n}\n.tab {\n  padding: 6px 14px;\n  border-radius: 8px;\n  background: #0f3460;\n  color: #aaa;\n  cursor: pointer;\n  font-size: 0.82em;\n  border: 1px solid transparent;\n  transition: all 0.2s;\n}\n.tab:hover { background: #1a3a5c; }\n.tab.ativa { background: #00d4ff; color: #000; border-color: #00d4ff; }\n\n#previewCodigo {\n  width: 100%;\n  min-height: 220px;\n  background: #0d1b2a;\n  color: #eee;\n  border: 1px solid #0f3460;\n  border-radius: 8px;\n  padding: 12px;\n  font-size: 0.78em;\n  font-family: monospace;\n  resize: vertical;\n}\n#previewFrame {\n  width: 100%;\n  height: 420px;\n  border: 1px solid #0f3460;\n  border-radius: 8px;\n  background: white;\n  display: none;\n}\n\n.stats {\n  display: flex;\n  gap: 10px;\n  flex-wrap: wrap;\n  margin-bottom: 12px;\n}\n\n#resultCodigo {\n  width: 100%;\n  min-height: 200px;\n  background: #0d1b2a;\n  color: #eee;\n  border: 1px solid #0f3460;\n  border-radius: 8px;\n  padding: 12px;\n  font-size: 0.78em;\n  font-family: monospace;\n  resize: vertical;\n}\n\n#log {\n  background: #0d1b2a;\n  border-radius: 8px;\n  padding: 10px;\n  font-size: 0.78em;\n  font-family: monospace;\n  color: #69f0ae;\n  min-height: 50px;\n  max-height: 130px;\n  overflow-y: auto;\n  margin-top: 10px;\n  display: none;\n}\n\n.opcoes {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 14px;\n  margin-top: 10px;\n}\n.opcao {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 0.85em;\n  color: #aaa;\n  cursor: pointer;\n}\n.opcao input { accent-color: #00d4ff; width: 16px; height: 16px; cursor: pointer; }\n\n.contador {\n  font-size: 0.82em;\n  color: #aaa;\n  margin-top: 10px;\n}\n.contador span { color: #00c853; font-weight: bold; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>🔧 Juntador de Projetos HTML\u003c/h1>\n\u003cp class=\"sub\">Importa ZIP, seleciona as partes com preview em tempo real e baixa um HTML único\u003c/p>\n\n\u003c!-- UPLOAD -->\n\u003cdiv class=\"card\">\n  \u003ch2>📦 1. Importe o projeto ZIP\u003c/h2>\n  \u003cdiv id=\"dropZone\" onclick=\"document.getElementById('fileInput').click()\">\n    \u003cdiv class=\"icon\">📂\u003c/div>\n    \u003cp>Clique aqui ou arraste o arquivo ZIP\u003c/p>\n    \u003cp style=\"font-size:0.75em; margin-top:4px;\">Aceita: .zip — com arquivos HTML, CSS, JS\u003c/p>\n  \u003c/div>\n  \u003cinput type=\"file\" id=\"fileInput\" accept=\".zip,.html,.htm,.css,.js\">\n\n  \u003cdiv id=\"seletorPrincipal\" style=\"display:none; margin-top:14px;\">\n    \u003chr class=\"separador\">\n    \u003clabel style=\"font-size:0.85em; color:#aaa;\">\n      📌 Selecione o HTML principal (normalmente index.html):\n    \u003c/label>\n    \u003cselect id=\"selectPrincipal\" onchange=\"mudarPrincipal()\">\u003c/select>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ARQUIVOS ENCONTRADOS -->\n\u003cdiv class=\"card\" id=\"arquivosArea\" style=\"display:none;\">\n  \u003ch2>📁 2. Selecione as partes para juntar\u003c/h2>\n  \u003cdiv class=\"dica\">\n    \u003cstrong>💡 Como usar:\u003c/strong> Clique em qualquer arquivo para ver o preview. Marque os que quer incluir no HTML final. O arquivo principal já vem marcado. Depois clique em \"Juntar Selecionados\".\n  \u003c/div>\n  \u003cdiv class=\"contador\">\n    Selecionados: \u003cspan id=\"contSelecionados\">0\u003c/span> de \u003cspan id=\"contTotal\">0\u003c/span> arquivos\n  \u003c/div>\n  \u003cdiv class=\"arquivos-grid\" id=\"arquivosGrid\">\u003c/div>\n  \u003cdiv class=\"btns\">\n    \u003cbutton class=\"btn-blue\" onclick=\"selecionarTodos()\">☑️ Selecionar Todos\u003c/button>\n    \u003cbutton class=\"btn-orange\" onclick=\"desmarcarTodos()\">⬜ Desmarcar Todos\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- OPÇÕES -->\n\u003cdiv class=\"card\" id=\"opcoesArea\" style=\"display:none;\">\n  \u003ch2>⚙️ 3. Opções de junção\u003c/h2>\n  \u003cdiv class=\"opcoes\">\n    \u003clabel class=\"opcao\">\n      \u003cinput type=\"checkbox\" id=\"optComentarios\" checked>\n      Adicionar comentários de separação\n    \u003c/label>\n    \u003clabel class=\"opcao\">\n      \u003cinput type=\"checkbox\" id=\"optLog\">\n      Mostrar log detalhado\n    \u003c/label>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- PREVIEW DO ARQUIVO CLICADO -->\n\u003cdiv class=\"card\" id=\"previewArea\" style=\"display:none;\">\n  \u003ch2 id=\"previewTitulo\">👁️ Preview\u003c/h2>\n  \u003cdiv class=\"preview-tabs\">\n    \u003cdiv class=\"tab ativa\" id=\"tabCodigo\" onclick=\"mudarTab('codigo', this)\">📝 Código\u003c/div>\n    \u003cdiv class=\"tab\" id=\"tabVisual\" onclick=\"mudarTab('visual', this)\">🖥️ Visual\u003c/div>\n  \u003c/div>\n  \u003ctextarea id=\"previewCodigo\" readonly>\u003c/textarea>\n  \u003ciframe id=\"previewFrame\" sandbox=\"allow-scripts allow-same-origin\">\u003c/iframe>\n\u003c/div>\n\n\u003c!-- JUNTAR -->\n\u003cdiv class=\"card\" id=\"juntarArea\" style=\"display:none;\">\n  \u003ch2>🚀 4. Juntar e baixar\u003c/h2>\n  \u003cdiv class=\"btns\">\n    \u003cbutton class=\"btn-blue\" id=\"btnJuntar\" onclick=\"juntar()\">⚡ Juntar Selecionados\u003c/button>\n    \u003cbutton class=\"btn-red\" onclick=\"limparTudo()\">🗑️ Limpar tudo\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"log\">\u003c/div>\n\u003c/div>\n\n\u003c!-- RESULTADO -->\n\u003cdiv class=\"card\" id=\"resultArea\" style=\"display:none;\">\n  \u003ch2>✅ 5. Resultado — HTML Unificado\u003c/h2>\n  \u003cdiv class=\"stats\" id=\"statsResult\">\u003c/div>\n  \u003ctextarea id=\"resultCodigo\" readonly>\u003c/textarea>\n  \u003cdiv class=\"btns\" style=\"margin-top:10px;\">\n    \u003cbutton class=\"btn-green\" onclick=\"baixarFinal()\">⬇️ Baixar HTML Unificado\u003c/button>\n    \u003cbutton class=\"btn-blue\" onclick=\"copiarFinal()\">📋 Copiar Código\u003c/button>\n    \u003cbutton class=\"btn-orange\" onclick=\"previewFinal()\">🖥️ Preview do Resultado\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\">\u003c/script>\n\u003cscript>\n// ===================== ESTADO =====================\nlet arquivosZip = {};       // nome -> conteudo texto\nlet arquivosPrincipal = ''; // nome do HTML principal\nlet selecionados = new Set();\nlet arquivoAtivo = null;\nlet tabAtiva = 'codigo';\nlet htmlFinal = '';\n\n// ===================== UPLOAD =====================\nconst dropZone = document.getElementById('dropZone');\ndropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });\ndropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));\ndropZone.addEventListener('drop', e => {\n  e.preventDefault();\n  dropZone.classList.remove('dragover');\n  if (e.dataTransfer.files[0]) processarEntrada(e.dataTransfer.files[0]);\n});\ndocument.getElementById('fileInput').addEventListener('change', e => {\n  if (e.target.files[0]) processarEntrada(e.target.files[0]);\n  e.target.value = '';\n});\n\nasync function processarEntrada(file) {\n  const ext = file.name.split('.').pop().toLowerCase();\n  if (ext === 'zip') {\n    await processarZip(file);\n  } else {\n    // Arquivo único — adicionar direto\n    const conteudo = await lerTexto(file);\n    arquivosZip = {};\n    arquivosZip[file.name] = conteudo;\n    arquivosPrincipal = file.name;\n    selecionados = new Set([file.name]);\n    document.getElementById('seletorPrincipal').style.display = 'none';\n    renderArquivos();\n  }\n}\n\nasync function processarZip(file) {\n  addLog('📦 Lendo ZIP...');\n  try {\n    const zip = await JSZip.loadAsync(file);\n    arquivosZip = {};\n    const htmls = [];\n\n    // Ler todos os arquivos de texto\n    for (const [caminho, entrada] of Object.entries(zip.files)) {\n      if (entrada.dir) continue;\n      const nome = caminho.split('/').pop();\n      const ext = nome.split('.').pop().toLowerCase();\n      if (['html','htm','css','js','json','txt'].includes(ext)) {\n        try {\n          arquivosZip[caminho] = await entrada.async('text');\n          if (ext === 'html' || ext === 'htm') htmls.push(caminho);\n          addLog('📄 ' + caminho);\n        } catch(e) { /* binário, ignorar */ }\n      }\n    }\n\n    if (Object.keys(arquivosZip).length === 0) {\n      alert('Nenhum arquivo de texto encontrado no ZIP!');\n      return;\n    }\n\n    // Preencher seletor de principal\n    const sel = document.getElementById('selectPrincipal');\n    sel.innerHTML = '';\n    const ordenados = Object.keys(arquivosZip)\n      .filter(n => n.endsWith('.html') || n.endsWith('.htm'))\n      .sort((a,b) => {\n        if (a.toLowerCase().includes('index')) return -1;\n        if (b.toLowerCase().includes('index')) return 1;\n        return a.localeCompare(b);\n      });\n\n    if (ordenados.length > 0) {\n      ordenados.forEach(h => {\n        const opt = document.createElement('option');\n        opt.value = h;\n        opt.textContent = h;\n        sel.appendChild(opt);\n      });\n      arquivosPrincipal = ordenados[0];\n      document.getElementById('seletorPrincipal').style.display = 'block';\n    } else {\n      // Sem HTML — pegar qualquer arquivo\n      arquivosPrincipal = Object.keys(arquivosZip)[0];\n    }\n\n    // Selecionar principal + todos por padrão\n    selecionados = new Set(Object.keys(arquivosZip));\n\n    renderArquivos();\n    addLog('✅ ZIP processado! ' + Object.keys(arquivosZip).length + ' arquivo(s) encontrado(s).');\n  } catch(e) {\n    alert('Erro ao ler ZIP: ' + e.message);\n  }\n}\n\nfunction mudarPrincipal() {\n  arquivosPrincipal = document.getElementById('selectPrincipal').value;\n  renderArquivos();\n  // Se o principal estava sendo visualizado, atualizar\n  if (arquivoAtivo === arquivosPrincipal) mostrarPreview(arquivosPrincipal);\n}\n\n// ===================== RENDER ARQUIVOS =====================\nfunction renderArquivos() {\n  const grid = document.getElementById('arquivosGrid');\n  const arquivos = Object.keys(arquivosZip);\n\n  document.getElementById('contTotal').textContent = arquivos.length;\n  document.getElementById('contSelecionados').textContent = selecionados.size;\n\n  grid.innerHTML = arquivos.map(caminho => {\n    const nome = caminho.split('/').pop();\n    const ext = nome.split('.').pop().toLowerCase();\n    const conteudo = arquivosZip[caminho];\n    const linhas = conteudo.split('\\n').length;\n    const tamanho = formatBytes(new Blob([conteudo]).size);\n    const isPrincipal = caminho === arquivosPrincipal;\n    const isSel = selecionados.has(caminho);\n    const icone = ext === 'html' || ext === 'htm' ? '🌐' :\n                  ext === 'css' ? '🎨' :\n                  ext === 'js'  ? '⚡' :\n                  ext === 'json'? '📋' : '📄';\n    const cor = ext === 'css' ? 'css-cor' :\n                ext === 'js'  ? 'js-cor'  :\n                (ext === 'html' || ext === 'htm') ? 'html-cor' : 'outro-cor';\n\n    return `\n      \u003cdiv class=\"arquivo-card ${isPrincipal ? 'principal' : isSel ? 'selecionado' : ''}\"\n           id=\"card-${CSS.escape(caminho)}\"\n           onclick=\"clicarCard('${escaparId(caminho)}')\">\n        \u003cdiv class=\"arquivo-titulo ${cor}\">${icone} ${nome}\u003c/div>\n        \u003cdiv class=\"arquivo-info\">${caminho !== nome ? '📁 ' + caminho + '\u003cbr>' : ''}${linhas} linhas • ${tamanho}\u003c/div>\n        \u003cdiv class=\"arquivo-badges\">\n          \u003cspan class=\"badge ${ext}\">${ext.toUpperCase()}\u003c/span>\n          ${isPrincipal ? '\u003cspan class=\"badge principal-badge\">⭐ PRINCIPAL\u003c/span>' : ''}\n          ${isSel ? '\u003cspan class=\"badge\" style=\"background:#0a2a1a;color:#00c853\">✓ Incluído\u003c/span>' : '\u003cspan class=\"badge\" style=\"background:#2a0a0a;color:#f44336\">✗ Excluído\u003c/span>'}\n        \u003c/div>\n        \u003cdiv class=\"arquivo-btns\">\n          \u003cbutton class=\"btn-blue\" onclick=\"event.stopPropagation(); mostrarPreview('${escaparId(caminho)}'); mudarTab('codigo', document.getElementById('tabCodigo'))\">📝 Ver\u003c/button>\n          \u003cbutton class=\"btn-green\" onclick=\"event.stopPropagation(); mostrarPreview('${escaparId(caminho)}'); mudarTab('visual', document.getElementById('tabVisual'))\">🖥️ Preview\u003c/button>\n          \u003cbutton class=\"${isSel ? 'btn-red' : 'btn-green'}\" onclick=\"event.stopPropagation(); toggleSelecionado('${escaparId(caminho)}')\">\n            ${isSel ? '✗ Remover' : '✓ Incluir'}\n          \u003c/button>\n        \u003c/div>\n      \u003c/div>\n    `;\n  }).join('');\n\n  document.getElementById('arquivosArea').style.display = 'block';\n  document.getElementById('opcoesArea').style.display = 'block';\n  document.getElementById('juntarArea').style.display = 'block';\n\n  // Mostrar preview do principal automaticamente\n  if (arquivosPrincipal && arquivosZip[arquivosPrincipal]) {\n    mostrarPreview(arquivosPrincipal);\n  }\n}\n\nfunction clicarCard(caminho) {\n  caminho = decaminho(caminho);\n  mostrarPreview(caminho);\n}\n\nfunction toggleSelecionado(caminho) {\n  caminho = decaminho(caminho);\n  // Principal não pode ser desmarcado\n  if (caminho === arquivosPrincipal) {\n    alert('O arquivo principal não pode ser removido!');\n    return;\n  }\n  if (selecionados.has(caminho)) {\n    selecionados.delete(caminho);\n  } else {\n    selecionados.add(caminho);\n  }\n  renderArquivos();\n  // Manter preview aberto\n  if (arquivoAtivo) mostrarPreview(arquivoAtivo);\n}\n\nfunction selecionarTodos() {\n  selecionados = new Set(Object.keys(arquivosZip));\n  renderArquivos();\n}\n\nfunction desmarcarTodos() {\n  // Manter só o principal\n  selecionados = new Set([arquivosPrincipal]);\n  renderArquivos();\n}\n\n// ===================== PREVIEW =====================\nfunction mostrarPreview(caminho) {\n  caminho = decaminho(caminho);\n  arquivoAtivo = caminho;\n  const conteudo = arquivosZip[caminho] || '';\n  const nome = caminho.split('/').pop();\n\n  document.getElementById('previewTitulo').textContent = '👁️ Preview — ' + nome;\n  document.getElementById('previewCodigo').value = conteudo;\n  document.getElementById('previewArea').style.display = 'block';\n\n  if (tabAtiva === 'visual') renderVisual(caminho, conteudo);\n\n  document.getElementById('previewArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n}\n\nfunction mudarTab(tab, el) {\n  tabAtiva = tab;\n  document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativa'));\n  if (el) el.classList.add('ativa');\n\n  const codArea = document.getElementById('previewCodigo');\n  const frame   = document.getElementById('previewFrame');\n\n  if (tab === 'codigo') {\n    codArea.style.display = 'block';\n    frame.style.display = 'none';\n  } else {\n    codArea.style.display = 'none';\n    frame.style.display = 'block';\n    if (arquivoAtivo) {\n      renderVisual(arquivoAtivo, arquivosZip[arquivoAtivo] || '');\n    }\n  }\n}\n\nfunction renderVisual(caminho, conteudo) {\n  const frame = document.getElementById('previewFrame');\n  const ext = caminho.split('.').pop().toLowerCase();\n  let html = '';\n\n  if (ext === 'html' || ext === 'htm') {\n    html = conteudo;\n  } else if (ext === 'css') {\n    html = `\u003c!DOCTYPE html>\u003chtml>\u003chead>\u003cstyle>${conteudo}\u003c/style>\u003c/head>\n    \u003cbody style=\"background:#1a1a2e;color:#eee;padding:20px;font-family:Arial\">\n    \u003ch2 style=\"color:#00d4ff\">Preview CSS — ${caminho.split('/').pop()}\u003c/h2>\n    \u003cp>Arquivo de estilos. Veja o código na aba 📝 Código.\u003c/p>\n    \u003cdiv style=\"margin-top:16px\">\u003cbutton>Botão exemplo\u003c/button>\n    \u003cp style=\"margin-top:8px\">Parágrafo exemplo\u003c/p>\u003c/div>\u003c/body>\u003c/html>`;\n  } else if (ext === 'js') {\n    html = `\u003c!DOCTYPE html>\u003chtml>\u003chead>\u003c/head>\n    \u003cbody style=\"background:#1a1a2e;color:#eee;padding:20px;font-family:monospace\">\n    \u003ch2 style=\"color:#00d4ff;font-family:Arial\">⚡ ${caminho.split('/').pop()}\u003c/h2>\n    \u003cpre style=\"background:#0d1b2a;padding:14px;border-radius:8px;overflow:auto;font-size:0.78em;color:#69f0ae;max-height:320px\">${escapeHtml(conteudo.substring(0,3000))}${conteudo.length>3000?'\\n\\n...(truncado)':''}\u003c/pre>\n    \u003c/body>\u003c/html>`;\n  } else {\n    html = `\u003c!DOCTYPE html>\u003chtml>\u003cbody style=\"background:#1a1a2e;color:#eee;padding:20px;font-family:monospace\">\n    \u003cpre style=\"font-size:0.8em\">${escapeHtml(conteudo.substring(0,2000))}\u003c/pre>\u003c/body>\u003c/html>`;\n  }\n\n  frame.srcdoc = html;\n}\n\n// ===================== JUNTAR =====================\nasync function juntar() {\n  if (!arquivosPrincipal || !arquivosZip[arquivosPrincipal]) {\n    alert('Selecione um arquivo HTML principal primeiro!');\n    return;\n  }\n\n  document.getElementById('log').innerHTML = '';\n  document.getElementById('resultArea').style.display = 'none';\n  addLog('🔧 Iniciando junção...');\n\n  const optCom = document.getElementById('optComentarios').checked;\n  let resultado = arquivosZip[arquivosPrincipal];\n  addLog('📌 Principal: ' + arquivosPrincipal);\n\n  // Separar arquivos selecionados por tipo\n  const cssArqs = [];\n  const jsArqs  = [];\n\n  for (const caminho of selecionados) {\n    if (caminho === arquivosPrincipal) continue;\n    const ext = caminho.split('.').pop().toLowerCase();\n    if (ext === 'css') cssArqs.push(caminho);\n    else if (ext === 'js') jsArqs.push(caminho);\n  }\n\n  // ---- EMBUTIR CSS ----\n  for (const caminho of cssArqs) {\n    const nome = caminho.split('/').pop();\n    const conteudo = arquivosZip[caminho];\n\n    // Tentar substituir \u003clink> que referencia este arquivo\n    const regexLink = new RegExp(\n      `\u003clink[^>]*href=[\"'][^\"']*${escapeRegex(nome)}[\"'][^>]*>`, 'gi'\n    );\n\n    if (regexLink.test(resultado)) {\n      resultado = resultado.replace(regexLink,\n        (optCom ? `\\n\u003c!-- ===== CSS: ${nome} ===== -->\\n` : '') +\n        `\u003cstyle>\\n${conteudo}\\n\u003c/style>`\n      );\n      addLog('🎨 CSS substituído (link→style): ' + nome);\n    } else {\n      // Inserir antes do \u003c/head>\n      const bloco =\n        (optCom ? `\\n\u003c!-- ===== CSS: ${nome} ===== -->\\n` : '') +\n        `\u003cstyle>\\n${conteudo}\\n\u003c/style>\\n`;\n      resultado = resultado.includes('\u003c/head>')\n        ? resultado.replace('\u003c/head>', bloco + '\u003c/head>')\n        : bloco + resultado;\n      addLog('🎨 CSS adicionado ao head: ' + nome);\n    }\n  }\n\n  // ---- EMBUTIR JS ----\n  for (const caminho of jsArqs) {\n    const nome = caminho.split('/').pop();\n    const conteudo = arquivosZip[caminho];\n\n    // Tentar substituir \u003cscript src=\"...\">\n    const regexScript = new RegExp(\n      `\u003cscript[^>]*src=[\"'][^\"']*${escapeRegex(nome)}[\"'][^>]*>\\\\s*\u003c\\\\/script>`, 'gi'\n    );\n\n    if (regexScript.test(resultado)) {\n      resultado = resultado.replace(regexScript,\n        (optCom ? `\\n\u003c!-- ===== JS: ${nome} ===== -->\\n` : '') +\n        `\u003cscript>\\n${conteudo}\\n\u003c\\/script>`\n      );\n      addLog('⚡ JS substituído (src→inline): ' + nome);\n    } else {\n      // Inserir antes do \u003c/body>\n      const bloco =\n        (optCom ? `\\n\u003c!-- ===== JS: ${nome} ===== -->\\n` : '') +\n        `\u003cscript>\\n${conteudo}\\n\u003c\\/script>\\n`;\n      resultado = resultado.includes('\u003c/body>')\n        ? resultado.replace('\u003c/body>', bloco + '\u003c/body>')\n        : resultado + bloco;\n      addLog('⚡ JS adicionado ao body: ' + nome);\n    }\n  }\n\n  htmlFinal = resultado;\n\n  // Estatísticas\n  const linhas = resultado.split('\\n').length;\n  const tamanho = new Blob([resultado]).size;\n  document.getElementById('statsResult').innerHTML = `\n    \u003cspan class=\"badge\">${selecionados.size} arquivos juntados\u003c/span>\n    \u003cspan class=\"badge\">${linhas.toLocaleString()} linhas\u003c/span>\n    \u003cspan class=\"badge\">${formatBytes(tamanho)}\u003c/span>\n  `;\n  document.getElementById('resultCodigo').value = resultado;\n  document.getElementById('resultArea').style.display = 'block';\n  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });\n\n  addLog('✅ Concluído! ' + linhas.toLocaleString() + ' linhas no HTML final.');\n}\n\n// ===================== RESULTADO =====================\nfunction baixarFinal() {\n  if (!htmlFinal) return;\n  const blob = new Blob([htmlFinal], { type: 'text/html' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'projeto_unificado.html';\n  a.click();\n}\n\nfunction copiarFinal() {\n  navigator.clipboard.writeText(htmlFinal)\n    .then(() => alert('✅ Código copiado!'))\n    .catch(() => {\n      document.getElementById('resultCodigo').select();\n      document.execCommand('copy');\n      alert('✅ Código copiado!');\n    });\n}\n\nfunction previewFinal() {\n  if (!htmlFinal) return;\n  const frame = document.getElementById('previewFrame');\n  document.getElementById('previewTitulo').textContent = '👁️ Preview — HTML Final Unificado';\n  document.getElementById('previewCodigo').value = htmlFinal;\n  document.getElementById('previewArea').style.display = 'block';\n  mudarTab('visual', document.getElementById('tabVisual'));\n  frame.srcdoc = htmlFinal;\n  document.getElementById('previewArea').scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n\n// ===================== UTILS =====================\nfunction lerTexto(file) {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = e => resolve(e.target.result);\n    reader.onerror = reject;\n    reader.readAsText(file, 'UTF-8');\n  });\n}\n\nfunction addLog(msg) {\n  const log = document.getElementById('log');\n  if (document.getElementById('optLog') && document.getElementById('optLog').checked) {\n    log.style.display = 'block';\n    log.innerHTML += msg + '\\n';\n    log.scrollTop = log.scrollHeight;\n  }\n}\n\nfunction limparTudo() {\n  arquivosZip = {};\n  arquivosPrincipal = '';\n  selecionados = new Set();\n  arquivoAtivo = null;\n  htmlFinal = '';\n  document.getElementById('seletorPrincipal').style.display = 'none';\n  document.getElementById('arquivosArea').style.display = 'none';\n  document.getElementById('opcoesArea').style.display = 'none';\n  document.getElementById('previewArea').style.display = 'none';\n  document.getElementById('juntarArea').style.display = 'none';\n  document.getElementById('resultArea').style.display = 'none';\n  document.getElementById('log').innerHTML = '';\n  document.getElementById('log').style.display = 'none';\n  document.getElementById('fileInput').value = '';\n  // Reset tabs\n  document.getElementById('tabCodigo').classList.add('ativa');\n  document.getElementById('tabVisual').classList.remove('ativa');\n  document.getElementById('previewCodigo').style.display = 'block';\n  document.getElementById('previewFrame').style.display = 'none';\n  tabAtiva = 'codigo';\n}\n\nfunction formatBytes(bytes) {\n  if (bytes \u003c 1024) return bytes + ' B';\n  if (bytes \u003c 1048576) return (bytes/1024).toFixed(1) + ' KB';\n  return (bytes/1048576).toFixed(1) + ' MB';\n}\n\nfunction escapeHtml(str) {\n  return str.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\n}\n\nfunction escapeRegex(str) {\n  return str.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n}\n\n// Escapar caminho para usar em onclick\nfunction escaparId(caminho) {\n  return caminho.replace(/\\\\/g,'\\\\\\\\').replace(/'/g,\"\\\\'\");\n}\n\nfunction decaminho(caminho) {\n  return caminho.replace(/\\\\'/g,\"'\");\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}];P.forEach(function(x,i){document.getElementById("f"+i).srcdoc=x.src});var mao=document.getElementById("mao");document.onclick=function(e){var b=e.target.closest("[data-p],[data-c]");if(!b)return;var i=+(b.dataset.p||b.dataset.c);var f=document.getElementById("f"+i).contentWindow;if(b.dataset.p!=null)f.postMessage({brqCmd:"pegar"},"*");else f.postMessage({brqCmd:"colar",texto:mao.value},"*")};window.onmessage=function(e){var d=e.data||{};if(d.brqTexto!=null)mao.value=d.brqTexto;if(d.brq)P.forEach(function(x,i){if(d.para==="*"||d.para===x.nome)document.getElementById("f"+i).contentWindow.postMessage(d,"*")})};</script></body></html>
