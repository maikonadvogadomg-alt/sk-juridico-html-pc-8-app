px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>Medidor de Imagem\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap\">\n\u003cstyle>\n/* Layout: uma coluna; cada imagem vira um cartão com a \"conta\" de quanto custa em cada IA */\n:root {\n  --bg:#f3f5f8; --papel:#ffffff; --tx:#16202c; --mudo:#5a6676; --linha:#d7dee8; --acc:#1f5fbf; --acc-claro:#e6eefb; --bom:#1d7a4a; --bom-bg:#e2f3e9; --aviso:#8a5a00; --aviso-bg:#fbf1d9;\n  --f-texto:\"Atkinson Hyperlegible\", system-ui, sans-serif; --f-num:\"JetBrains Mono\", ui-monospace, monospace;\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) { --bg:#10151c; --papel:#18202b; --tx:#e5ebf2; --mudo:#9aa7b8; --linha:#2b3646; --acc:#7fb0ff; --acc-claro:#1b2a40; --bom:#5fd197; --bom-bg:#15301f; --aviso:#ebc46a; --aviso-bg:#33290f; color-scheme:dark } }\n:root[data-theme=\"dark\"] { --bg:#10151c; --papel:#18202b; --tx:#e5ebf2; --mudo:#9aa7b8; --linha:#2b3646; --acc:#7fb0ff; --acc-claro:#1b2a40; --bom:#5fd197; --bom-bg:#15301f; --aviso:#ebc46a; --aviso-bg:#33290f; color-scheme:dark }\nbody { background:var(--bg); color:var(--tx); font-family:var(--f-texto); font-size:17px; line-height:1.5; }\n.pag { max-width:760px; margin:0 auto; padding-block:22px 60px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:16px; }\nh1 { font-size:clamp(26px, 6vw, 36px); margin:0; line-height:1.15; text-wrap:balance; }\nh2 { font-size:18px; margin:0; word-break:break-all; }\np { margin:0; }\n.mudo { color:var(--mudo); }\n.dica { background:var(--acc-claro); border-radius:12px; padding:12px 14px; display:grid; gap:6px; }\n.escolher { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 22px; border-radius:12px; background:var(--acc); color:#fff; font-weight:700; cursor:pointer; font-size:17px; }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .escolher { color:#0d1520 } }\n:root[data-theme=\"dark\"] .escolher { color:#0d1520 }\n.escolher:focus-within { outline:3px solid var(--tx); outline-offset:2px; }\n.cartao { background:var(--papel); border:1px solid var(--linha); border-radius:14px; padding:14px; display:grid; gap:10px; }\n.topo-cartao { display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:start; }\n.topo-cartao img { width:96px; height:96px; object-fit:cover; border-radius:10px; border:1px solid var(--linha); background:#000; cursor:zoom-in; }\n.dados { display:grid; gap:2px; font-size:15px; min-width:0; }\n.num { font-family:var(--f-num); font-variant-numeric:tabular-nums; }\n.tab { overflow-x:auto; }\ntable { border-collapse:collapse; width:100%; font-size:15px; }\nth, td { padding:7px 6px; border-bottom:1px solid var(--linha); text-align:right; white-space:nowrap; }\nth:first-child, td:first-child { text-align:left; }\nth { font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--mudo); font-weight:700; }\ntr.destaque td { background:var(--bom-bg); }\n.selo { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; background:var(--bom-bg); color:var(--bom); font-weight:700; }\n.comparar { background:var(--aviso-bg); color:var(--tx); border-radius:12px; padding:12px 14px; display:grid; gap:6px; }\n.comparar b { color:var(--aviso); }\n.ver { display:flex; gap:8px; flex-wrap:wrap; }\n.ver button { font:inherit; font-size:15px; min-height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--linha); background:var(--papel); color:var(--tx); cursor:pointer; }\n.ver button:focus-visible { outline:3px solid var(--acc); }\n.grande { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }\n.grande img { max-width:100%; max-height:80vh; object-fit:contain; background:#fff; }\n.grande p { color:#fff; text-align:center; }\n.grande button { font:inherit; min-height:48px; padding:0 22px; border-radius:12px; border:0; background:#fff; color:#111; font-weight:700; cursor:pointer; }\n.vazio { border:2px dashed var(--linha); border-radius:14px; padding:22px; text-align:center; color:var(--mudo); }\n\u003c/style>\n\n\u003cmain class=\"pag\">\n  \u003cheader style=\"display:grid;gap:8px\">\n    \u003ch1>Medidor de Imagem\u003c/h1>\n    \u003cp class=\"mudo\">Escolha o print do jeito que o celular tira e, se quiser, as versões \"compactadas\" por outros apps. Ele mostra quanto cada uma custa em \u003cb>tokens\u003c/b> em cada IA, e como o Meu Chat manda.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"dica\">\n    \u003cp>🔎 \u003cb>A regra:\u003c/b> a IA corta a imagem em quadradinhos. O que decide o preço é o \u003cb>tamanho em pixels\u003c/b> (largura × altura), não os KB do arquivo nem o \"foco\".\u003c/p>\n    \u003cp class=\"mudo\">Por isso um app que só \"compacta\" (deixa o arquivo menor mas com os mesmos pixels) não muda o custo. O que muda é \u003cb>diminuir a largura e a altura\u003c/b>.\u003c/p>\n  \u003c/section>\n\n  \u003cdiv>\u003clabel class=\"escolher\">📂 Escolher imagens\u003cinput type=\"file\" id=\"arq\" accept=\"image/*\" multiple hidden>\u003c/label>\u003c/div>\n\n  \u003cdiv id=\"comparacao\">\u003c/div>\n  \u003cdiv id=\"lista\">\u003cdiv class=\"vazio\">Nenhuma imagem ainda. Escolha um print para ver a conta.\u003c/div>\u003c/div>\n\n  \u003csection class=\"dica\">\n    \u003cp>\u003cb>Como a conta é feita\u003c/b> (aproximada, regras públicas de cada empresa):\u003c/p>\n    \u003cp class=\"mudo\">Gemini: 258 tokens por quadrado de até 768×768 (imagem de até 384×384 = 258). Claude: largura × altura ÷ 750 (imagem maior que 1568 px é reduzida antes). GPT/OpenAI: 85 + 170 por quadrado de 512×512, depois de caber em 2048 e o lado menor em 768.\u003c/p>\n  \u003c/section>\n\u003c/main>\n\n\u003cscript>\n(function () {\n  'use strict';\n  const $ = (s) => document.querySelector(s);\n  const E = (s) => String(s).replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n  const fmt = (n) => Math.round(n).toLocaleString('pt-BR');\n  const kb = (n) => n > 1048576 ? (n / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB' : fmt(n / 1024) + ' KB';\n  const ESCALAS = [['Do jeito que está', 0], ['Meu Chat · Nítida', 1600], ['Meu Chat · Média', 1024], ['Meu Chat · Alta', 768]];\n  function caber(w, h, max) { if (!max) return [w, h]; const k = Math.min(1, max / Math.max(w, h)); return [Math.round(w * k), Math.round(h * k)]; }\n  function gemini(w, h) { if (w \u003c= 384 && h \u003c= 384) return 258; return 258 * Math.ceil(w / 768) * Math.ceil(h / 768); }\n  function claude(w, h) { const k = Math.min(1, 1568 / Math.max(w, h)); w = w * k; h = h * k; return Math.ceil(w * h / 750); }\n  function openai(w, h) { let k = Math.min(1, 2048 / Math.max(w, h)); w *= k; h *= k; k = Math.min(1, 768 / Math.min(w, h)); w *= k; h *= k; return 85 + 170 * Math.ceil(w / 512) * Math.ceil(h / 512); }\n  const itens = [];\n  function abrirImagem(f) { return new Promise((ok, er) => { const u = URL.createObjectURL(f); const i = new Image(); i.onload = () => ok({ u, w: i.naturalWidth, h: i.naturalHeight, img: i }); i.onerror = () => er(new Error('não abriu')); i.src = u; }); }\n  function versao(img, max) { const [w, h] = caber(img.naturalWidth, img.naturalHeight, max); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); return c.toDataURL('image/jpeg', max === 768 ? 0.6 : max === 1600 ? 0.85 : 0.72); }\n  $('#arq').addEventListener('change', async (e) => {\n    for (const f of e.target.files) { try { const d = await abrirImagem(f); itens.push({ nome: f.name, tam: f.size, ...d }); } catch (er) { /* imagem que não abre fica de fora */ } }\n    e.target.value = ''; pintar();\n  });\n  function linhas(it) {\n    return ESCALAS.map(([n, max], k) => { const [w, h] = caber(it.w, it.h, max); return '\u003ctr' + (max === 1024 ? ' class=\"destaque\"' : '') + '>\u003ctd>' + n + (max === 1024 ? ' \u003cspan class=\"selo\">padrão\u003c/span>' : '') + '\u003cbr>\u003cspan class=\"mudo num\" style=\"font-size:13px\">' + w + '×' + h + '\u003c/span>\u003c/td>\u003ctd class=\"num\">' + fmt(gemini(w, h)) + '\u003c/td>\u003ctd class=\"num\">' + fmt(claude(w, h)) + '\u003c/td>\u003ctd class=\"num\">' + fmt(openai(w, h)) + '\u003c/td>\u003c/tr>'; }).join('');\n  }\n  function pintar() {\n    if (!itens.length) { $('#lista').innerHTML = '\u003cdiv class=\"vazio\">Nenhuma imagem ainda. Escolha um print para ver a conta.\u003c/div>'; $('#comparacao').innerHTML = ''; return; }\n    $('#lista').innerHTML = itens.map((it, i) => '\u003carticle class=\"cartao\">\u003cdiv class=\"topo-cartao\">\u003cimg src=\"' + it.u + '\" alt=\"miniatura de ' + E(it.nome) + '\" data-ver=\"' + i + '|0\">\u003cdiv class=\"dados\">\u003ch2>' + E(it.nome) + '\u003c/h2>' +\n      '\u003cspan>Arquivo: \u003cb class=\"num\">' + kb(it.tam) + '\u003c/b>\u003c/span>\u003cspan>Tamanho: \u003cb class=\"num\">' + it.w + ' × ' + it.h + '\u003c/b> pixels\u003c/span>\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Como vai\u003c/th>\u003cth>Gemini\u003c/th>\u003cth>Claude\u003c/th>\u003cth>GPT\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>' + linhas(it) + '\u003c/tbody>\u003c/table>\u003c/div>' +\n      '\u003cp class=\"mudo\" style=\"font-size:14px\">Números = tokens. 258 tokens ≈ um parágrafo de texto.\u003c/p>' +\n      '\u003cdiv class=\"ver\">\u003cbutton type=\"button\" data-ver=\"' + i + '|1024\">👁 Ver como a IA recebe (Média)\u003c/button>\u003cbutton type=\"button\" data-ver=\"' + i + '|768\">👁 Ver na Alta (768)\u003c/button>\u003c/div>\u003c/article>').join('');\n    // compara a 1ª com as outras: KB caiu, mas os pixels?\n    if (itens.length > 1) {\n      const a = itens[0];\n      $('#comparacao').innerHTML = '\u003csection class=\"comparar\">\u003cp>\u003cb>Comparando com a 1ª imagem\u003c/b> (' + E(a.nome) + ')\u003c/p>' + itens.slice(1).map((b) => {\n        const kbMenos = Math.round((1 - b.tam / a.tam) * 100), ga = gemini(a.w, a.h), gb = gemini(b.w, b.h), ca = claude(a.w, a.h), cb = claude(b.w, b.h);\n        return '\u003cp>• \u003cb>' + E(b.nome) + '\u003c/b>: arquivo ' + (kbMenos >= 0 ? kbMenos + '% menor' : (-kbMenos) + '% maior') + '; tokens no Gemini ' + fmt(ga) + ' → ' + fmt(gb) + ', no Claude ' + fmt(ca) + ' → ' + fmt(cb) + '. ' +\n          (gb === ga && cb === ca ? '\u003ci>Mesmo custo: só os KB mudaram, os pixels são os mesmos.\u003c/i>' : cb \u003c ca ? '\u003ci>Ficou mais barato porque diminuiu os pixels.\u003c/i>' : '\u003ci>Ficou mais caro (mais pixels).\u003c/i>') + '\u003c/p>';\n      }).join('') + '\u003c/section>';\n    } else $('#comparacao').innerHTML = '';\n  }\n  document.addEventListener('click', (e) => {\n    const b = e.target.closest('[data-ver]'); if (!b) return;\n    const [i, max] = b.dataset.ver.split('|').map(Number), it = itens[i]; if (!it) return;\n    const src = max ? versao(it.img, max) : it.u, [w, h] = caber(it.w, it.h, max);\n    const g = document.createElement('div'); g.className = 'grande'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true');\n    g.innerHTML = '\u003cimg src=\"' + src + '\" alt=\"como a IA recebe\">\u003cp>' + (max ? 'Assim a IA recebe: ' + w + '×' + h + ' pixels. Dá para ler o texto? Se não, use uma opção mais nítida.' : 'Original: ' + w + '×' + h) + '\u003c/p>\u003cbutton type=\"button\">✕ Fechar\u003c/button>';\n    g.addEventListener('click', (ev) => { if (ev.target.tagName !== 'IMG') g.remove(); });\n    document.body.appendChild(g); g.querySelector('button').focus();\n  });\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>"},{"nome":"Preparador-pprinfs.html","src":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\u003cscript>(function(){var ME=\"Preparador-pprinfs.html\";var D={};var S={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){D[k]=String(v);parent.postMessage({brqLS:D,de:ME},\"*\")},removeItem:function(k){delete D[k];parent.postMessage({brqLS:D,de:ME},\"*\")},clear:function(){D={};parent.postMessage({brqLS:D,de:ME},\"*\")},key:function(i){return Object.keys(D)[i]||null},get length(){return Object.keys(D).length}};try{window.localStorage.getItem(\"x\")}catch(e){try{Object.defineProperty(window,\"localStorage\",{value:S,configurable:true})}catch(e2){}}window.Brinquedo={nome:ME,enviar:function(para,dados){parent.postMessage({brq:1,de:ME,para:para||\"*\",dados:dados},\"*\")},receber:function(fn){window.addEventListener(\"message\",function(e){var d=e.data;if(d&&d.brq&&d.de!==ME)fn(d.dados,d.de)})}};window.addEventListener(\"message\",function(e){var d=e.data;if(!d||!d.brqCmd)return;if(d.brqCmd===\"pegar\"){var s=String(window.getSelection()||\"\");if(!s.trim()){var c=document.querySelectorAll(\"textarea,output,pre,#resultado,.resultado,#saida,.saida,#output,.output\");for(var i=c.length-1;i>=0&&!s.trim();i--){s=c[i].value!=null&&c[i].tagName!==\"OUTPUT\"?c[i].value:c[i].innerText}}if(!s.trim())s=document.body.innerText;parent.postMessage({brqTexto:s,de:ME},\"*\")}if(d.brqCmd===\"colar\"){var a=document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)?document.activeElement:document.querySelector(\"textarea,input[type=text],input[type=search],input:not([type]),[contenteditable=true]\");if(a){if(\"value\" in a){a.value=d.texto;a.dispatchEvent(new Event(\"input\",{bubbles:true}));a.dispatchEvent(new Event(\"change\",{bubbles:true}))}else a.innerText=d.texto;a.focus&&a.focus()}parent.postMessage({brqColou:!!a,de:ME},\"*\")}});})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Preparar Prints para IA\u003c/title>\n\u003cstyle>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body {\n    font-family: 'Segoe UI', sans-serif;\n    background: #0f172a;\n    color: #e2e8f0;\n    padding: 16px;\n    font-size: 16px;\n  }\n  h1 { text-align: center; color: #7c3aed; font-size: 1.4rem; margin-bottom: 4px; }\n  .subtitulo { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }\n\n  .abas {\n    display: flex;\n    gap: 6px;\n    margin-bottom: 16px;\n  }\n  .aba {\n    flex: 1;\n    padding: 10px 8px;\n    background: #1e293b;\n    border: 2px solid #334155;\n    border-radius: 10px;\n    text-align: center;\n    cursor: pointer;\n    font-size: 0.82rem;\n    color: #94a3b8;\n    transition: all 0.2s;\n  }\n  .aba.ativa {\n    background: #7c3aed;\n    border-color: #7c3aed;\n    color: white;\n    font-weight: bold;\n  }\n  .secao { display: none; }\n  .secao.visivel { display: block; }\n\n  .card {\n    background: #1e293b;\n    border: 1px solid #334155;\n    border-radius: 14px;\n    padding: 16px;\n    margin-bottom: 14px;\n  }\n  .card-titulo {\n    font-weight: bold;\n    color: #c4b5fd;\n    margin-bottom: 12px;\n    font-size: 1rem;\n  }\n\n  .btn {\n    display: inline-block;\n    padding: 12px 20px;\n    border-radius: 10px;\n    border: none;\n    cursor: pointer;\n    font-size: 0.9rem;\n    font-weight: bold;\n    transition: all 0.2s;\n    margin: 4px 4px 4px 0;\n  }\n  .btn-roxo { background: #7c3aed; color: white; }\n  .btn-roxo:hover { background: #6d28d9; }\n  .btn-verde { background: #16a34a; color: white; }\n  .btn-verde:hover { background: #15803d; }\n  .btn-cinza { background: #334155; color: #94a3b8; }\n  .btn-cinza:hover { background: #475569; }\n  .btn-vermelho { background: #dc2626; color: white; }\n\n  /* ZONA DE SOLTAR */\n  .zona-drop {\n    border: 3px dashed #334155;\n    border-radius: 14px;\n    padding: 30px 16px;\n    text-align: center;\n    cursor: pointer;\n    transition: all 0.2s;\n    margin-bottom: 12px;\n  }\n  .zona-drop:hover, .zona-drop.arrastando {\n    border-color: #7c3aed;\n    background: #1e1b4b;\n  }\n  .zona-drop-icone { font-size: 2.5rem; margin-bottom: 8px; }\n  .zona-drop-texto { color: #94a3b8; font-size: 0.9rem; }\n  .zona-drop-texto strong { color: #c4b5fd; }\n\n  /* GRADE DE IMAGENS */\n  .grade-imagens {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));\n    gap: 8px;\n    margin-bottom: 12px;\n  }\n  .item-imagem {\n    background: #0f172a;\n    border: 2px solid #334155;\n    border-radius: 10px;\n    overflow: hidden;\n    position: relative;\n  }\n  .item-imagem img {\n    width: 100%;\n    height: 90px;\n    object-fit: cover;\n    display: block;\n  }\n  .item-imagem .nome {\n    font-size: 0.7rem;\n    color: #94a3b8;\n    padding: 4px 6px;\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n  }\n  .item-imagem .remover {\n    position: absolute;\n    top: 4px;\n    right: 4px;\n    background: #dc2626;\n    color: white;\n    border: none;\n    border-radius: 50%;\n    width: 22px;\n    height: 22px;\n    font-size: 0.7rem;\n    cursor: pointer;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n  .item-imagem .numero {\n    position: absolute;\n    top: 4px;\n    left: 4px;\n    background: #7c3aed;\n    color: white;\n    border-radius: 50%;\n    width: 22px;\n    height: 22px;\n    font-size: 0.7rem;\n    font-weight: bold;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n\n  /* OPÇÕES */\n  .opcoes-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 8px;\n    margin-bottom: 12px;\n  }\n  .opcao-item {\n    background: #0f172a;\n    border: 2px solid #334155;\n    border-radius: 10px;\n    padding: 10px;\n  }\n  .opcao-item label {\n    font-size: 0.82rem;\n    color: #94a3b8;\n    display: block;\n    margin-bottom: 4px;\n  }\n  select, input[type=\"range\"] {\n    width: 100%;\n    background: #1e293b;\n    border: 1px solid #334155;\n    border-radius: 6px;\n    color: #e2e8f0;\n    padding: 6px 8px;\n    font-size: 0.85rem;\n  }\n  .valor-range {\n    font-size: 0.8rem;\n    color: #c4b5fd;\n    text-align: right;\n    margin-top: 2px;\n  }\n\n  /* RESULTADO */\n  .resultado-box {\n    background: #0f172a;\n    border: 2px solid #22c55e;\n    border-radius: 10px;\n    padding: 12px;\n    margin-top: 12px;\n    display: none;\n  }\n  .resultado-box.visivel { display: block; }\n  .resultado-info {\n    font-size: 0.85rem;\n    color: #86efac;\n    margin-bottom: 10px;\n    font-weight: bold;\n  }\n\n  textarea {\n    width: 100%;\n    background: #0f172a;\n    border: 2px solid #334155;\n    border-radius: 8px;\n    color: #e2e8f0;\n    padding: 10px;\n    font-size: 0.78rem;\n    font-family: monospace;\n    resize: vertical;\n    min-height: 120px;\n    outline: none;\n  }\n\n  /* CANVAS OCULTO */\n  canvas { display: none; }\n\n  /* PROGRESSO */\n  .progresso {\n    background: #334155;\n    border-radius: 10px;\n    height: 8px;\n    margin: 8px 0;\n    overflow: hidden;\n    display: none;\n  }\n  .progresso-barra {\n    background: #7c3aed;\n    height: 100%;\n    border-radius: 10px;\n    transition: width 0.3s;\n  }\n  .progresso-texto {\n    font-size: 0.8rem;\n    color: #94a3b8;\n    text-align: center;\n    margin-bottom: 4px;\n  }\n\n  /* MOSAICO PREVIEW */\n  .mosaico-preview {\n    width: 100%;\n    border-radius: 10px;\n    border: 1px solid #334155;\n    margin-bottom: 8px;\n  }\n\n  .instrucao {\n    background: #1e1b4b;\n    border: 1px solid #7c3aed;\n    border-radius: 10px;\n    padding: 12px;\n    font-size: 0.85rem;\n    margin-bottom: 12px;\n    color: #c4b5fd;\n  }\n\n  .rodape {\n    text-align: center;\n    font-size: 0.75rem;\n    color: #475569;\n    margin-top: 20px;\n    padding-top: 12px;\n    border-top: 1px solid #1e293b;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>🖼️ Preparar Prints para IA\u003c/h1>\n\u003cp class=\"subtitulo\">Junte vários prints em um só ou converta para texto — para mandar para a IA de uma vez\u003c/p>\n\n\u003cdiv class=\"abas\">\n  \u003cdiv class=\"aba ativa\" onclick=\"trocarAba('mosaico', this)\">🖼️ Juntar em 1\u003c/div>\n  \u003cdiv class=\"aba\" onclick=\"trocarAba('reduzir', this)\">📦 Reduzir\u003c/div>\n  \u003cdiv class=\"aba\" onclick=\"trocarAba('base64', this)\">💻 Para Código\u003c/div>\n\u003c/div>\n\n\u003c!-- ===== ABA MOSAICO ===== -->\n\u003cdiv id=\"mosaico\" class=\"secao visivel\">\n\n  \u003cdiv class=\"instrucao\">\n    💡 \u003cstrong>Como usar:\u003c/strong> Importe vários prints → ele junta tudo em \u003cstrong>1 imagem só\u003c/strong> → você manda essa imagem para a IA de uma vez!\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"card-titulo\">📥 Importe os prints\u003c/div>\n\n    \u003cdiv class=\"zona-drop\" id=\"zona-mosaico\"\n      onclick=\"document.getElementById('input-mosaico').click()\"\n      ondragover=\"event.preventDefault(); this.classList.add('arrastando')\"\n      ondragleave=\"this.classList.remove('arrastando')\"\n      ondrop=\"soltarArquivos(event, 'mosaico')\">\n      \u003cdiv class=\"zona-drop-icone\">📸\u003c/div>\n      \u003cdiv class=\"zona-drop-texto\">\n        \u003cstrong>Toque aqui para importar\u003c/strong>\u003cbr>\n        ou arraste as imagens\u003cbr>\n        \u003cspan style=\"font-size:0.75rem;\">PNG, JPG, WEBP — vários de uma vez\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cinput type=\"file\" id=\"input-mosaico\" accept=\"image/*\" multiple style=\"display:none\" onchange=\"adicionarImagens(this.files, 'mosaico')\">\n\n    \u003cdiv id=\"grade-mosaico\" class=\"grade-imagens\">\u003c/div>\n\n    \u003cdiv id=\"controles-mosaico\" style=\"display:none;\">\n      \u003cdiv class=\"opcoes-grid\">\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>📐 Colunas\u003c/label>\n          \u003cselect id=\"colunas-mosaico\">\n            \u003coption value=\"1\">1 coluna\u003c/option>\n            \u003coption value=\"2\" selected>2 colunas\u003c/option>\n            \u003coption value=\"3\">3 colunas\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>📏 Largura máxima\u003c/label>\n          \u003cselect id=\"largura-mosaico\">\n            \u003coption value=\"600\">600px (menor)\u003c/option>\n            \u003coption value=\"900\" selected>900px (médio)\u003c/option>\n            \u003coption value=\"1200\">1200px (maior)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>🎨 Qualidade\u003c/label>\n          \u003cinput type=\"range\" id=\"qualidade-mosaico\" min=\"30\" max=\"95\" value=\"75\"\n            oninput=\"document.getElementById('val-qualidade-mosaico').textContent = this.value + '%'\">\n          \u003cdiv class=\"valor-range\" id=\"val-qualidade-mosaico\">75%\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>🏷️ Numerar prints\u003c/label>\n          \u003cselect id=\"numerar-mosaico\">\n            \u003coption value=\"sim\" selected>Sim — numera cada um\u003c/option>\n            \u003coption value=\"nao\">Não\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cbutton class=\"btn btn-roxo\" onclick=\"gerarMosaico()\">🖼️ Juntar tudo em 1 imagem\u003c/button>\n      \u003cbutton class=\"btn btn-cinza\" onclick=\"limparImagens('mosaico')\">🗑️ Limpar\u003c/button>\n    \u003c/div>\n\n    \u003cdiv id=\"progresso-mosaico\" class=\"progresso\">\n      \u003cdiv class=\"progresso-barra\" id=\"barra-mosaico\" style=\"width:0%\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"resultado-mosaico\" class=\"resultado-box\">\n      \u003cdiv class=\"resultado-info\" id=\"info-mosaico\">\u003c/div>\n      \u003ccanvas id=\"canvas-mosaico\">\u003c/canvas>\n      \u003cimg id=\"preview-mosaico\" class=\"mosaico-preview\" alt=\"Mosaico gerado\">\n      \u003cdiv style=\"margin-top:8px;\">\n        \u003cbutton class=\"btn btn-verde\" onclick=\"baixarMosaico()\">⬇️ Baixar imagem\u003c/button>\n        \u003cbutton class=\"btn btn-roxo\" onclick=\"copiarMosaicoBase64()\">📋 Copiar como código\u003c/button>\n      \u003c/div>\n      \u003cdiv style=\"font-size:0.8rem; color:#94a3b8; margin-top:8px;\">\n        💡 Baixe e mande para a IA — ou copie como código para colar direto no chat\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003c!-- ===== ABA REDUZIR ===== -->\n\u003cdiv id=\"reduzir\" class=\"secao\">\n\n  \u003cdiv class=\"instrucao\">\n    💡 \u003cstrong>Como usar:\u003c/strong> Importe prints grandes → reduz o tamanho → manda cada um separado mas menor, sem perder o que a IA precisa ver.\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"card-titulo\">📥 Importe os prints para reduzir\u003c/div>\n\n    \u003cdiv class=\"zona-drop\" id=\"zona-reduzir\"\n      onclick=\"document.getElementById('input-reduzir').click()\"\n      ondragover=\"event.preventDefault(); this.classList.add('arrastando')\"\n      ondragleave=\"this.classList.remove('arrastando')\"\n      ondrop=\"soltarArquivos(event, 'reduzir')\">\n      \u003cdiv class=\"zona-drop-icone\">📦\u003c/div>\n      \u003cdiv class=\"zona-drop-texto\">\n        \u003cstrong>Toque aqui para importar\u003c/strong>\u003cbr>\n        \u003cspan style=\"font-size:0.75rem;\">Vários de uma vez\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cinput type=\"file\" id=\"input-reduzir\" accept=\"image/*\" multiple style=\"display:none\" onchange=\"adicionarImagens(this.files, 'reduzir')\">\n\n    \u003cdiv id=\"grade-reduzir\" class=\"grade-imagens\">\u003c/div>\n\n    \u003cdiv id=\"controles-reduzir\" style=\"display:none;\">\n      \u003cdiv class=\"opcoes-grid\">\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>📏 Largura máxima\u003c/label>\n          \u003cselect id=\"largura-reduzir\">\n            \u003coption value=\"400\">400px (bem pequeno)\u003c/option>\n            \u003coption value=\"600\">600px (pequeno)\u003c/option>\n            \u003coption value=\"800\" selected>800px (médio)\u003c/option>\n            \u003coption value=\"1200\">1200px (grande)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>🎨 Qualidade\u003c/label>\n          \u003cinput type=\"range\" id=\"qualidade-reduzir\" min=\"20\" max=\"90\" value=\"65\"\n            oninput=\"document.getElementById('val-qualidade-reduzir').textContent = this.value + '%'\">\n          \u003cdiv class=\"valor-range\" id=\"val-qualidade-reduzir\">65%\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cbutton class=\"btn btn-roxo\" onclick=\"reduzirTodas()\">📦 Reduzir todas\u003c/button>\n      \u003cbutton class=\"btn btn-cinza\" onclick=\"limparImagens('reduzir')\">🗑️ Limpar\u003c/button>\n    \u003c/div>\n\n    \u003cdiv id=\"resultado-reduzir\" class=\"resultado-box\">\n      \u003cdiv class=\"resultado-info\" id=\"info-reduzir\">\u003c/div>\n      \u003cdiv id=\"lista-reduzidas\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003c!-- ===== ABA BASE64 ===== -->\n\u003cdiv id=\"base64\" class=\"secao\">\n\n  \u003cdiv class=\"instrucao\">\n    💡 \u003cstrong>Como usar:\u003c/strong> Converte os prints em \u003cstrong>texto/código\u003c/strong> — aí você cola direto no chat da IA sem precisar mandar imagem!\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"card-titulo\">💻 Converter prints em código de texto\u003c/div>\n\n    \u003cdiv class=\"zona-drop\" id=\"zona-base64\"\n      onclick=\"document.getElementById('input-base64').click()\"\n      ondragover=\"event.preventDefault(); this.classList.add('arrastando')\"\n      ondragleave=\"this.classList.remove('arrastando')\"\n      ondrop=\"soltarArquivos(event, 'base64')\">\n      \u003cdiv class=\"zona-drop-icone\">💻\u003c/div>\n      \u003cdiv class=\"zona-drop-texto\">\n        \u003cstrong>Toque aqui para importar\u003c/strong>\u003cbr>\n        \u003cspan style=\"font-size:0.75rem;\">Converte para texto que a IA entende\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cinput type=\"file\" id=\"input-base64\" accept=\"image/*\" multiple style=\"display:none\" onchange=\"adicionarImagens(this.files, 'base64')\">\n\n    \u003cdiv id=\"grade-base64\" class=\"grade-imagens\">\u003c/div>\n\n    \u003cdiv id=\"controles-base64\" style=\"display:none;\">\n      \u003cdiv class=\"opcoes-grid\">\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>📏 Reduzir antes\u003c/label>\n          \u003cselect id=\"largura-base64\">\n            \u003coption value=\"400\" selected>400px (recomendado)\u003c/option>\n            \u003coption value=\"600\">600px\u003c/option>\n            \u003coption value=\"original\">Original (maior)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv class=\"opcao-item\">\n          \u003clabel>🎨 Qualidade\u003c/label>\n          \u003cinput type=\"range\" id=\"qualidade-base64\" min=\"20\" max=\"80\" value=\"50\"\n            oninput=\"document.getElementById('val-qualidade-base64').textContent = this.value + '%'\">\n          \u003cdiv class=\"valor-range\" id=\"val-qualidade-base64\">50%\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cbutton class=\"btn btn-roxo\" onclick=\"converterBase64()\">💻 Converter para código\u003c/button>\n      \u003cbutton class=\"btn btn-cinza\" onclick=\"limparImagens('base64')\">🗑️ Limpar\u003c/button>\n    \u003c/div>\n\n    \u003cdiv id=\"resultado-base64\" class=\"resultado-box\">\n      \u003cdiv class=\"resultado-info\" id=\"info-base64\">\u003c/div>\n      \u003cp style=\"font-size:0.82rem; color:#94a3b8; margin-bottom:8px;\">\n        Cole esse texto inteiro no chat da IA — ela consegue ver as imagens assim:\n      \u003c/p>\n      \u003ctextarea id=\"texto-base64\" readonly>\u003c/textarea>\n      \u003cdiv style=\"margin-top:8px;\">\n        \u003cbutton class=\"btn btn-verde\" onclick=\"copiarBase64()\">📋 Copiar tudo\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003cdiv class=\"rodape\">Preparar Prints para IA · Monica AI · Novembro 2026\u003c/div>\n\n\u003cscript>\n// =============================================\n// DADOS\n// =============================================\nconst dados = {\n  mosaico: [],\n  reduzir: [],\n  base64: []\n};\n\n// =============================================\n// ABAS\n// =============================================\nfunction trocarAba(id, el) {\n  document.querySelectorAll('.secao').forEach(s => s.classList.remove('visivel'));\n  document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));\n  document.getElementById(id).classList.add('visivel');\n  el.classList.add('ativa');\n}\n\n// =============================================\n// ADICIONAR IMAGENS\n// =============================================\nfunction adicionarImagens(files, aba) {\n  Array.from(files).forEach(file => {\n    if (!file.type.startsWith('image/')) return;\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      dados[aba].push({ nome: file.name, src: e.target.result, tamanho: file.size });\n      atualizarGrade(aba);\n    };\n    reader.readAsDataURL(file);\n  });\n}\n\nfunction soltarArquivos(event, aba) {\n  event.preventDefault();\n  document.getElementById('zona-' + aba).classList.remove('arrastando');\n  adicionarImagens(event.dataTransfer.files, aba);\n}\n\n// =============================================\n// ATUALIZAR GRADE VISUAL\n// =============================================\nfunction atualizarGrade(aba) {\n  const grade = document.getElementById('grade-' + aba);\n  const controles = document.getElementById('controles-' + aba);\n  grade.innerHTML = '';\n\n  dados[aba].forEach((img, i) => {\n    const div = document.createElement('div');\n    div.className = 'item-imagem';\n    div.innerHTML = `\n      \u003cspan class=\"numero\">${i + 1}\u003c/span>\n      \u003cimg src=\"${img.src}\" alt=\"${img.nome}\">\n      \u003cbutton class=\"remover\" onclick=\"removerImagem('${aba}', ${i})\">✕\u003c/button>\n      \u003cdiv class=\"nome\">${img.nome}\u003c/div>\n    `;\n    grade.appendChild(div);\n  });\n\n  controles.style.display = dados[aba].length > 0 ? 'block' : 'none';\n}\n\nfunction removerImagem(aba, index) {\n  dados[aba].splice(index, 1);\n  atualizarGrade(aba);\n}\n\nfunction limparImagens(aba) {\n  dados[aba] = [];\n  atualizarGrade(aba);\n  const res = document.getElementById('resultado-' + aba);\n  if (res) res.classList.remove('visivel');\n}\n\n// =============================================\n// GERAR MOSAICO\n// =============================================\nasync function gerarMosaico() {\n  const imgs = dados.mosaico;\n  if (imgs.length === 0) { alert('Importe as imagens primeiro!'); return; }\n\n  const colunas = parseInt(document.getElementById('colunas-mosaico').value);\n  const larguraMax = parseInt(document.getElementById('largura-mosaico').value);\n  const qualidade = parseInt(document.getElementById('qualidade-mosaico').value) / 100;\n  const numerar = document.getElementById('numerar-mosaico').value === 'sim';\n\n  const progresso = document.getElementById('progresso-mosaico');\n  const barra = document.getElementById('barra-mosaico');\n  progresso.style.display = 'block';\n\n  // Carrega todas as imagens\n  const imgsCarregadas = await Promise.all(imgs.map((img, i) => {\n    return new Promise(resolve => {\n      const el = new Image();\n      el.onload = () => {\n        barra.style.width = ((i + 1) / imgs.length * 50) + '%';\n        resolve(el);\n      };\n      el.src = img.src;\n    });\n  }));\n\n  const larguraCelula = Math.floor(larguraMax / colunas);\n  const linhas = Math.ceil(imgs.length / colunas);\n\n  // Calcula alturas proporcionais\n  const alturas = imgsCarregadas.map(img => {\n    const ratio = img.naturalHeight / img.naturalWidth;\n    return Math.floor(larguraCelula * ratio);\n  });\n\n  // Calcula altura de cada linha\n  const alturasPorLinha = [];\n  for (let l = 0; l \u003c linhas; l++) {\n    let maxAltura = 0;\n    for (let c = 0; c \u003c colunas; c++) {\n      const idx = l * colunas + c;\n      if (idx \u003c alturas.length) maxAltura = Math.max(maxAltura, alturas[idx]);\n    }\n    alturasPorLinha.push(maxAltura);\n  }\n\n  const alturaTotal = alturasPorLinha.reduce((a, b) => a + b, 0) + (linhas * 4);\n\n  const canvas = document.getElementById('canvas-mosaico');\n  canvas.width = larguraMax;\n  canvas.height = alturaTotal;\n  const ctx = canvas.getContext('2d');\n\n  ctx.fillStyle = '#1e293b';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n  let y = 0;\n  for (let l = 0; l \u003c linhas; l++) {\n    for (let c = 0; c \u003c colunas; c++) {\n      const idx = l * colunas + c;\n      if (idx >= imgsCarregadas.length) break;\n      const x = c * larguraCelula;\n      ctx.drawImage(imgsCarregadas[idx], x, y, larguraCelula, alturasPorLinha[l]);\n\n      if (numerar) {\n        ctx.fillStyle = 'rgba(124, 58, 237, 0.85)';\n        ctx.fillRect(x + 4, y + 4, 28, 28);\n        ctx.fillStyle = 'white';\n        ctx.font = 'bold 16px sans-serif';\n        ctx.fillText(idx + 1, x + 10, y + 22);\n      }\n\n      barra.style.width = (50 + (idx + 1) / imgs.length * 50) + '%';\n    }\n    y += alturasPorLinha[l] + 4;\n  }\n\n  const dataUrl = canvas.toDataURL('image/jpeg', qualidade);\n  const tamanhoKB = Math.round(dataUrl.length * 0.75 / 1024);\n\n  document.getElementById('preview-mosaico').src = dataUrl;\n  document.getElementById('info-mosaico').innerHTML =\n    `✅ Mosaico gerado! \u003cstrong>${imgs.length} prints\u003c/strong> em 1 imagem · ${tamanhoKB} KB`;\n  document.getElementById('resultado-mosaico').classList.add('visivel');\n  progresso.style.display = 'none';\n}\n\nfunction baixarMosaico() {\n  const canvas = document.getElementById('canvas-mosaico');\n  const link = document.createElement('a');\n  link.download = 'prints-para-ia.jpg';\n  link.href = canvas.toDataURL('image/jpeg', 0.85);\n  link.click();\n}\n\nfunction copiarMosaicoBase64() {\n  const canvas = document.getElementById('canvas-mosaico');\n  const data = canvas.toDataURL('image/jpeg', 0.7);\n  const texto = `[IMAGEM COM ${dados.mosaico.length} PRINTS DO PROJETO]\\ndata:image/jpeg;base64,${data.split(',')[1]}`;\n  navigator.clipboard.writeText(texto).then(() => {\n    alert('✅ Copiado! Cole no chat da IA.');\n  });\n}\n\n// =============================================\n// REDUZIR TODAS\n// =============================================\nasync function reduzirTodas() {\n  const imgs = dados.reduzir;\n  if (imgs.length === 0) { alert('Importe as imagens primeiro!'); return; }\n\n  const larguraMax = document.getElementById('largura-reduzir').value;\n  const qualidade = parseInt(document.getElementById('qualidade-reduzir').value) / 100;\n  const lista = document.getElementById('lista-reduzidas');\n  lista.innerHTML = '';\n\n  let totalAntes = 0;\n  let totalDepois = 0;\n\n  for (let i = 0; i \u003c imgs.length; i++) {\n    const img = imgs[i];\n    const resultado = await reduzirImagem(img.src, parseInt(larguraMax), qualidade);\n    const antesKB = Math.round(img.tamanho / 1024);\n    const depoisKB = Math.round(resultado.length * 0.75 / 1024);\n    totalAntes += antesKB;\n    totalDepois += depoisKB;\n\n    const div = document.createElement('div');\n    div.style.cssText = 'background:#1e293b;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;';\n    div.innerHTML = `\n      \u003cimg src=\"${resultado}\" style=\"width:60px;height:60px;object-fit:cover;border-radius:6px;\">\n      \u003cdiv style=\"flex:1;\">\n        \u003cdiv style=\"font-size:0.82rem;font-weight:bold;\">${img.nome}\u003c/div>\n        \u003cdiv style=\"font-size:0.78rem;color:#94a3b8;\">${antesKB} KB → \u003cspan style=\"color:#86efac\">${depoisKB} KB\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cbutton class=\"btn btn-verde\" style=\"padding:8px 12px;font-size:0.8rem;\" onclick=\"baixarImagem('${resultado}', '${img.nome}')\">⬇️\u003c/button>\n    `;\n    lista.appendChild(div);\n  }\n\n  document.getElementById('info-reduzir').innerHTML =\n    `✅ ${imgs.length} imagem(ns) reduzida(s) · ${totalAntes} KB → \u003cstrong>${totalDepois} KB\u003c/strong> (economizou ${totalAntes - totalDepois} KB)`;\n  document.getElementById('resultado-reduzir').classList.add('visivel');\n}\n\n// =============================================\n// CONVERTER PARA BASE64/TEXTO\n// =============================================\nasync function converterBase64() {\n  const imgs = dados.base64;\n  if (imgs.length === 0) { alert('Importe as imagens primeiro!'); return; }\n\n  const largura = document.getElementById('largura-base64').value;\n  const qualidade = parseInt(document.getElementById('qualidade-base64').value) / 100;\n\n  let texto = `Estou enviando ${imgs.length} print(s) do meu projeto para você analisar:\\n\\n`;\n\n  for (let i = 0; i \u003c imgs.length; i++) {\n    const img = imgs[i];\n    let src = img.src;\n\n    if (largura !== 'original') {\n      src = await reduzirImagem(img.src, parseInt(largura), qualidade);\n    }\n\n    const base64 = src.split(',')[1];\n    const tipo = src.split(';')[0].split(':')[1];\n    const kb = Math.round(base64.length * 0.75 / 1024);\n\n    texto += `--- Print ${i + 1}: ${img.nome} (${kb} KB) ---\\n`;\n    texto += `data:${tipo};base64,${base64}\\n\\n`;\n  }\n\n  texto += `\\nPor favor, analise esses prints e me diga o que você vê.`;\n\n  document.getElementById('texto-base64').value = texto;\n  document.getElementById('info-base64').innerHTML =\n    `✅ ${imgs.length} print(s) convertido(s) em texto · ${Math.round(texto.length / 1024)} KB total`;\n  document.getElementById('resultado-base64').classList.add('visivel');\n}\n\nfunction copiarBase64() {\n  const texto = document.getElementById('texto-base64').value;\n  navigator.clipboard.writeText(texto).then(() => {\n    alert('✅ Copiado! Cole no chat da IA.');\n  }).catch(() => {\n    document.getElementById('texto-base64').select();\n    document.execCommand('copy');\n    alert('✅ Copiado!');\n  });\n}\n\n// =============================================\n// UTILITÁRIOS\n// =============================================\nfunction reduzirImagem(src, larguraMax, qualidade) {\n  return new Promise(resolve => {\n    const img = new Image();\n    img.onload = () => {\n      const canvas = document.createElement('canvas');\n      let w = img.naturalWidth;\n      let h = img.naturalHeight;\n      if (w > larguraMax) {\n        h = Math.floor(h * larguraMax / w);\n        w = larguraMax;\n      }\n      canvas.width = w;\n      canvas.height = h;\n      canvas.getContext('2d').drawImage(img, 0, 0, w, h);\n      resolve(canvas.toDataURL('image/jpeg', qualidade));\n    };\n    img.src = src;\n  });\n}\n\nfunction baixarImagem(src, nome) {\n  const link = document.createElement('a');\n  link.download = 'reduzida-' + nome.replace(/\\.[^.]+$/, '') + '.jpg';\n  link.href = src;\n  link.click();\n}\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"},{"nome":"Conversor-1.html","src":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\u003cscript>(function(){var ME=\"Conversor-1.html\";var D={};var S={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){D[k]=String(v);parent.postMessage({brqLS:D,de:ME},\"*\")},removeItem:function(k){delete D[k];parent.postMessage({brqLS:D,de:ME},\"*\")},clear:function(){D={};parent.postMessage({brqLS:D,de:ME},\"*\")},key:function(i){return Object.keys(D)[i]||null},get length(){return Object.keys(D).length}};try{window.localStorage.getItem(\"x\")}catch(e){try{Object.defineProperty(window,\"localStorage\",{value:S,configurable:true})}catch(e2){}}window.Brinquedo={nome:ME,enviar:function(para,dados){parent.postMessage({brq:1,de:ME,para:para||\"*\",dados:dados},\"*\")},receber:function(fn){window.addEventListener(\"message\",function(e){var d=e.data;if(d&&d.brq&&d.de!==ME)fn(d.dados,d.de)})}};window.addEventListener(\"message\",function(e){var d=e.data;if(!d||!d.brqCmd)return;if(d.brqCmd===\"pegar\"){var s=String(window.getSelection()||\"\");if(!s.trim()){var c=document.querySelectorAll(\"textarea,output,pre,#resultado,.resultado,#saida,.saida,#output,.output\");for(var i=c.length-1;i>=0&&!s.trim();i--){s=c[i].value!=null&&c[i].tagName!==\"OUTPUT\"?c[i].value:c[i].innerText}}if(!s.trim())s=document.body.innerText;parent.postMessage({brqTexto:s,de:ME},\"*\")}if(d.brqCmd===\"colar\"){var a=document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)?document.activeElement:document.querySelector(\"textarea,input[type=text],input[type=search],input:not([type]),[contenteditable=true]\");if(a){if(\"value\" in a){a.value=d.texto;a.dispatchEvent(new Event(\"input\",{bubbles:true}));a.dispatchEvent(new Event(\"change\",{bubbles:true}))}else a.innerText=d.texto;a.focus&&a.focus()}parent.postMessage({brqColou:!!a,de:ME},\"*\")}});})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Conversor de Imagem Econômico\u003c/title>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js\">\u003c/script>\n\u003cstyle>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body {\n    font-family: Arial, sans-serif;\n    background: #1a1a2e;\n    color: #eee;\n    min-height: 100vh;\n    padding: 20px;\n  }\n  h1 {\n    text-align: center;\n    color: #00d4ff;\n    margin-bottom: 6px;\n    font-size: 1.4em;\n  }\n  .sub {\n    text-align: center;\n    color: #aaa;\n    font-size: 0.85em;\n    margin-bottom: 20px;\n  }\n  .card {\n    background: #16213e;\n    border-radius: 12px;\n    padding: 18px;\n    margin-bottom: 16px;\n    border: 1px solid #0f3460;\n  }\n  .card h2 {\n    color: #00d4ff;\n    font-size: 1em;\n    margin-bottom: 12px;\n  }\n\n  /* ÁREA DE DROP */\n  #dropZone {\n    border: 2px dashed #00d4ff;\n    border-radius: 10px;\n    padding: 30px;\n    text-align: center;\n    cursor: pointer;\n    transition: background 0.3s;\n    background: #0d1b2a;\n  }\n  #dropZone:hover, #dropZone.dragover {\n    background: #1a3a5c;\n  }\n  #dropZone p { color: #aaa; font-size: 0.9em; margin-top: 8px; }\n  #dropZone .icon { font-size: 2.5em; }\n  #fileInput { display: none; }\n\n  /* PREVIEW */\n  #previewBox { display: none; margin-top: 14px; text-align: center; }\n  #previewImg {\n    max-width: 100%;\n    max-height: 220px;\n    border-radius: 8px;\n    border: 1px solid #0f3460;\n  }\n  .info-row {\n    display: flex;\n    gap: 10px;\n    justify-content: center;\n    margin-top: 8px;\n    flex-wrap: wrap;\n  }\n  .badge {\n    background: #0f3460;\n    border-radius: 20px;\n    padding: 4px 12px;\n    font-size: 0.8em;\n    color: #00d4ff;\n  }\n\n  /* CONTROLES */\n  .controles {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 12px;\n    align-items: center;\n    margin-top: 14px;\n  }\n  .controles label { font-size: 0.85em; color: #aaa; }\n  .controles input[type=range] {\n    width: 120px;\n    accent-color: #00d4ff;\n  }\n  .val { color: #00d4ff; font-weight: bold; font-size: 0.9em; }\n\n  /* BOTÕES */\n  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }\n  button {\n    padding: 10px 18px;\n    border: none;\n    border-radius: 8px;\n    cursor: pointer;\n    font-size: 0.9em;\n    font-weight: bold;\n    transition: opacity 0.2s;\n  }\n  button:hover { opacity: 0.85; }\n  button:disabled { opacity: 0.4; cursor: not-allowed; }\n  .btn-blue  { background: #00d4ff; color: #000; }\n  .btn-green { background: #00c853; color: #000; }\n  .btn-orange{ background: #ff9800; color: #000; }\n  .btn-red   { background: #f44336; color: #fff; }\n\n  /* PROGRESSO */\n  #progressBox { display: none; margin-top: 12px; }\n  #progressBar {\n    width: 100%;\n    height: 10px;\n    background: #0f3460;\n    border-radius: 10px;\n    overflow: hidden;\n  }\n  #progressFill {\n    height: 100%;\n    background: linear-gradient(90deg, #00d4ff, #00c853);\n    width: 0%;\n    transition: width 0.3s;\n    border-radius: 10px;\n  }\n  #progressText {\n    text-align: center;\n    font-size: 0.8em;\n    color: #aaa;\n    margin-top: 6px;\n  }\n\n  /* RESULTADO */\n  #resultBox { display: none; }\n  #resultText {\n    width: 100%;\n    min-height: 160px;\n    background: #0d1b2a;\n    color: #eee;\n    border: 1px solid #0f3460;\n    border-radius: 8px;\n    padding: 12px;\n    font-size: 0.85em;\n    font-family: monospace;\n    resize: vertical;\n  }\n  .result-info {\n    display: flex;\n    gap: 10px;\n    flex-wrap: wrap;\n    margin-top: 8px;\n  }\n  .badge-green { background: #1b5e20; color: #69f0ae; }\n  .badge-red   { background: #b71c1c; color: #ff8a80; }\n\n  /* MODO */\n  .modo-tabs {\n    display: flex;\n    gap: 8px;\n    margin-bottom: 14px;\n    flex-wrap: wrap;\n  }\n  .tab {\n    padding: 7px 14px;\n    border-radius: 20px;\n    border: 1px solid #0f3460;\n    background: transparent;\n    color: #aaa;\n    cursor: pointer;\n    font-size: 0.82em;\n    font-weight: normal;\n  }\n  .tab.ativo {\n    background: #00d4ff;\n    color: #000;\n    border-color: #00d4ff;\n    font-weight: bold;\n  }\n\n  /* DICA */\n  .dica {\n    background: #0f3460;\n    border-left: 3px solid #00d4ff;\n    padding: 10px 14px;\n    border-radius: 0 8px 8px 0;\n    font-size: 0.82em;\n    color: #aaa;\n    margin-top: 10px;\n  }\n  .dica strong { color: #00d4ff; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>🖼️ Conversor de Imagem Econômico\u003c/h1>\n\u003cp class=\"sub\">Transforma prints em texto ou imagem comprimida — gasta muito menos tokens na IA\u003c/p>\n\n\u003c!-- UPLOAD -->\n\u003cdiv class=\"card\">\n  \u003ch2>📁 1. Escolha a imagem\u003c/h2>\n  \u003cdiv id=\"dropZone\" onclick=\"document.getElementById('fileInput').click()\">\n    \u003cdiv class=\"icon\">📷\u003c/div>\n    \u003cp>Clique aqui ou arraste uma imagem\u003c/p>\n    \u003cp style=\"font-size:0.75em; margin-top:4px;\">PNG, JPG, WEBP, BMP\u003c/p>\n  \u003c/div>\n  \u003cinput type=\"file\" id=\"fileInput\" accept=\"image/*\">\n  \u003cdiv id=\"previewBox\">\n    \u003cimg id=\"previewImg\" src=\"\" alt=\"preview\">\n    \u003cdiv class=\"info-row\">\n      \u003cspan class=\"badge\" id=\"badgeOriginal\">Original: --\u003c/span>\n      \u003cspan class=\"badge\" id=\"badgeDim\">Dimensão: --\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- MODO -->\n\u003cdiv class=\"card\">\n  \u003ch2>⚙️ 2. Escolha o modo\u003c/h2>\n  \u003cdiv class=\"modo-tabs\">\n    \u003cbutton class=\"tab ativo\" onclick=\"setModo('ocr', this)\">📝 Extrair Texto (OCR)\u003c/button>\n    \u003cbutton class=\"tab\" onclick=\"setModo('comprimir', this)\">🗜️ Comprimir Imagem\u003c/button>\n    \u003cbutton class=\"tab\" onclick=\"setModo('ambos', this)\">✨ Ambos\u003c/button>\n  \u003c/div>\n\n  \u003cdiv id=\"opcoesComprimir\">\n    \u003cdiv class=\"controles\">\n      \u003clabel>Qualidade:\u003c/label>\n      \u003cinput type=\"range\" id=\"qualidade\" min=\"10\" max=\"95\" value=\"40\"\n        oninput=\"document.getElementById('valQ').textContent=this.value+'%'\">\n      \u003cspan class=\"val\" id=\"valQ\">40%\u003c/span>\n\n      \u003clabel style=\"margin-left:10px;\">Largura máx:\u003c/label>\n      \u003cinput type=\"range\" id=\"largMax\" min=\"200\" max=\"1200\" step=\"50\" value=\"600\"\n        oninput=\"document.getElementById('valL').textContent=this.value+'px'\">\n      \u003cspan class=\"val\" id=\"valL\">600px\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"dica\">\n    \u003cstrong>💡 Dica:\u003c/strong> Para prints de código ou texto → use \u003cstrong>OCR\u003c/strong>. Para prints de tela com layout → use \u003cstrong>Comprimir\u003c/strong>. Para os dois → \u003cstrong>Ambos\u003c/strong>.\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- PROCESSAR -->\n\u003cdiv class=\"card\">\n  \u003ch2>🚀 3. Processar\u003c/h2>\n  \u003cdiv class=\"btns\">\n    \u003cbutton class=\"btn-blue\" id=\"btnProcessar\" onclick=\"processar()\" disabled>\n      ▶ Processar Imagem\n    \u003c/button>\n    \u003cbutton class=\"btn-red\" onclick=\"limpar()\">🗑️ Limpar\u003c/button>\n  \u003c/div>\n\n  \u003cdiv id=\"progressBox\">\n    \u003cdiv id=\"progressBar\">\u003cdiv id=\"progressFill\">\u003c/div>\u003c/div>\n    \u003cdiv id=\"progressText\">Aguardando...\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- RESULTADO -->\n\u003cdiv class=\"card\" id=\"resultBox\">\n  \u003ch2>✅ 4. Resultado\u003c/h2>\n  \u003cdiv class=\"result-info\">\n    \u003cspan class=\"badge badge-green\" id=\"badgeEconomia\">Economia: --\u003c/span>\n    \u003cspan class=\"badge\" id=\"badgeTokens\">Tokens aprox: --\u003c/span>\n    \u003cspan class=\"badge\" id=\"badgeFinal\">Tamanho final: --\u003c/span>\n  \u003c/div>\n\n  \u003cdiv style=\"margin-top:12px;\" id=\"areaOCR\" style=\"display:none\">\n    \u003cp style=\"font-size:0.85em; color:#aaa; margin-bottom:6px;\">📝 Texto extraído (copie e cole na IA):\u003c/p>\n    \u003ctextarea id=\"resultText\" readonly>\u003c/textarea>\n    \u003cdiv class=\"btns\" style=\"margin-top:8px;\">\n      \u003cbutton class=\"btn-green\" onclick=\"copiarTexto()\">📋 Copiar Texto\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"margin-top:12px;\" id=\"areaImg\" style=\"display:none\">\n    \u003cp style=\"font-size:0.85em; color:#aaa; margin-bottom:6px;\">🖼️ Imagem comprimida:\u003c/p>\n    \u003cimg id=\"imgComprimida\" style=\"max-width:100%; border-radius:8px; border:1px solid #0f3460;\">\n    \u003cdiv class=\"btns\" style=\"margin-top:8px;\">\n      \u003cbutton class=\"btn-orange\" onclick=\"baixarImagem()\">⬇️ Baixar Imagem\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nlet imagemArquivo = null;\nlet modoAtual = 'ocr';\nlet imgComprimidaBlob = null;\nlet imgComprimidaURL = null;\n\n// DRAG AND DROP\nconst dropZone = document.getElementById('dropZone');\ndropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });\ndropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));\ndropZone.addEventListener('drop', e => {\n  e.preventDefault();\n  dropZone.classList.remove('dragover');\n  const file = e.dataTransfer.files[0];\n  if (file && file.type.startsWith('image/')) carregarImagem(file);\n});\n\ndocument.getElementById('fileInput').addEventListener('change', e => {\n  if (e.target.files[0]) carregarImagem(e.target.files[0]);\n});\n\nfunction carregarImagem(file) {\n  imagemArquivo = file;\n  const reader = new FileReader();\n  reader.onload = ev => {\n    const img = document.getElementById('previewImg');\n    img.src = ev.target.result;\n    img.onload = () => {\n      document.getElementById('badgeDim').textContent = `Dimensão: ${img.naturalWidth}x${img.naturalHeight}px`;\n    };\n    document.getElementById('badgeOriginal').textContent = `Original: ${formatBytes(file.size)}`;\n    document.getElementById('previewBox').style.display = 'block';\n    document.getElementById('btnProcessar').disabled = false;\n    document.getElementById('resultBox').style.display = 'none';\n  };\n  reader.readAsDataURL(file);\n}\n\nfunction setModo(modo, btn) {\n  modoAtual = modo;\n  document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));\n  btn.classList.add('ativo');\n}\n\nasync function processar() {\n  if (!imagemArquivo) return;\n\n  document.getElementById('progressBox').style.display = 'block';\n  document.getElementById('resultBox').style.display = 'none';\n  document.getElementById('btnProcessar').disabled = true;\n  document.getElementById('areaOCR').style.display = 'none';\n  document.getElementById('areaImg').style.display = 'none';\n\n  setProgresso(5, 'Iniciando...');\n\n  try {\n    if (modoAtual === 'ocr') {\n      await fazerOCR();\n    } else if (modoAtual === 'comprimir') {\n      await fazerComprimir();\n    } else {\n      await fazerOCR();\n      await fazerComprimir();\n    }\n    document.getElementById('resultBox').style.display = 'block';\n  } catch(e) {\n    alert('Erro: ' + e.message);\n  }\n\n  document.getElementById('btnProcessar').disabled = false;\n}\n\nasync function fazerOCR() {\n  setProgresso(10, 'Carregando motor OCR...');\n\n  const worker = await Tesseract.createWorker('por+eng', 1, {\n    logger: m => {\n      if (m.status === 'recognizing text') {\n        setProgresso(20 + Math.round(m.progress * 70), `Lendo texto: ${Math.round(m.progress*100)}%`);\n      }\n    }\n  });\n\n  setProgresso(20, 'Analisando imagem...');\n  const { data: { text } } = await worker.recognize(imagemArquivo);\n  await worker.terminate();\n\n  const textoLimpo = text.trim();\n  document.getElementById('resultText').value = textoLimpo || '(Nenhum texto encontrado na imagem)';\n  document.getElementById('areaOCR').style.display = 'block';\n\n  // Calcular economia de tokens\n  const tokensTexto = Math.ceil(textoLimpo.length / 4);\n  const tokensImagem = Math.ceil(imagemArquivo.size / 500);\n  const economia = Math.max(0, Math.round((1 - tokensTexto/tokensImagem)*100));\n\n  document.getElementById('badgeTokens').textContent = `Tokens aprox: ~${tokensTexto}`;\n  document.getElementById('badgeEconomia').textContent = `Economia: ~${economia}%`;\n  document.getElementById('badgeFinal').textContent = `Chars: ${textoLimpo.length}`;\n\n  setProgresso(100, '✅ Texto extraído!');\n}\n\nasync function fazerComprimir() {\n  setProgresso(10, 'Comprimindo imagem...');\n\n  const qualidade = parseInt(document.getElementById('qualidade').value) / 100;\n  const largMax = parseInt(document.getElementById('largMax').value);\n\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = ev => {\n      const img = new Image();\n      img.onload = () => {\n        setProgresso(50, 'Redimensionando...');\n        const canvas = document.createElement('canvas');\n        let w = img.width, h = img.height;\n        if (w > largMax) { h = Math.round(h * largMax / w); w = largMax; }\n        canvas.width = w; canvas.height = h;\n        const ctx = canvas.getContext('2d');\n        ctx.drawImage(img, 0, 0, w, h);\n\n        setProgresso(80, 'Finalizando compressão...');\n        canvas.toBlob(blob => {\n          imgComprimidaBlob = blob;\n          imgComprimidaURL = URL.createObjectURL(blob);\n          document.getElementById('imgComprimida').src = imgComprimidaURL;\n          document.getElementById('areaImg').style.display = 'block';\n\n          const economia = Math.round((1 - blob.size/imagemArquivo.size)*100);\n          document.getElementById('badgeEconomia').textContent = `Economia: ~${economia}%`;\n          document.getElementById('badgeFinal').textContent = `Final: ${formatBytes(blob.size)}`;\n          document.getElementById('badgeTokens').textContent = `Original: ${formatBytes(imagemArquivo.size)}`;\n\n          setProgresso(100, '✅ Imagem comprimida!');\n          resolve();\n        }, 'image/jpeg', qualidade);\n      };\n      img.onerror = reject;\n      img.src = ev.target.result;\n    };\n    reader.onerror = reject;\n    reader.readAsDataURL(imagemArquivo);\n  });\n}\n\nfunction setProgresso(pct, texto) {\n  document.getElementById('progressFill').style.width = pct + '%';\n  document.getElementById('progressText').textContent = texto;\n}\n\nfunction copiarTexto() {\n  const txt = document.getElementById('resultText').value;\n  navigator.clipboard.writeText(txt).then(() => alert('✅ Texto copiado! Cole na IA.'));\n}\n\nfunction baixarImagem() {\n  if (!imgComprimidaURL) return;\n  const a = document.createElement('a');\n  a.href = imgComprimidaURL;\n  a.download = 'imagem_comprimida.jpg';\n  a.click();\n}\n\nfunction limpar() {\n  imagemArquivo = null;\n  document.getElementById('previewBox').style.display = 'none';\n  document.getElementById('progressBox').style.display = 'none';\n  document.getElementById('resultBox').style.display = 'none';\n  document.getElementById('fileInput').value = '';\n  document.getElementById('btnProcessar').disabled = true;\n  document.getElementById('resultText').value = '';\n  setProgresso(0, '');\n}\n\nfunction formatBytes(bytes) {\n  if (bytes \u003c 1024) return bytes + ' B';\n  if (bytes \u003c 1048576) return (bytes/1024).toFixed(1) + ' KB';\n  return (bytes/1048576).toFixed(1) + ' MB';\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}];P.forEach(function(x,i){document.getElementById("f"+i).srcdoc=x.src});var mao=document.getElementById("mao");document.onclick=function(e){var b=e.target.closest("[data-p],[data-c]");if(!b)return;var i=+(b.dataset.p||b.dataset.c);var f=document.getElementById("f"+i).contentWindow;if(b.dataset.p!=null)f.postMessage({brqCmd:"pegar"},"*");else f.postMessage({brqCmd:"colar",texto:mao.value},"*")};window.onmessage=function(e){var d=e.data||{};if(d.brqTexto!=null)mao.value=d.brqTexto;if(d.brq)P.forEach(function(x,i){if(d.para==="*"||d.para===x.nome)document.getElementById("f"+i).contentWindow.postMessage(d,"*")})};</script></body></html>
